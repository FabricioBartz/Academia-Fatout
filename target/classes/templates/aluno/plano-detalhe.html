<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body data-role="aluno">
    <!--Cabeçalho-->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#45a049;">
        <div class="container">
            <a class="navbar-brand logo-text mb-0" th:href="@{/aluno/painel_principal}" style="font-size: 24px;">Academia <span>FatOut</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPerfil"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse justify-content-end" id="navPerfil">
            <div class="d-flex align-items-center profile-section">
                <div class="text-end me-3 d-none d-sm-block">
                    <small class="d-block text-white-50">Bem-vindo,</small>
                    <strong class="text-white" th:text="${aluno.nome}">João Silva</strong>
                </div>

                <div class="profile-nav-wrapper">
                    <img th:if="${aluno.fotoPerfil != null}" 
                         th:src="@{'/uploads/perfis/' + ${aluno.fotoPerfil}}" 
                         class="nav-avatar-modern">
                    <i th:unless="${aluno.fotoPerfil != null}" 
                       class="bi bi-person-circle nav-avatar-icon-modern"></i>
                </div>

                <a href="/" class="btn-sair-modern ms-3">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            </div>
            </div>
        </div>
    </nav>

<div class="container mt-4">
<div class="row">
            <!-- Menu -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Menu</h5>
                        <div class="list-group list-group-flush">
                            <a th:href="@{/aluno/painel_principal}" class="list-group-item list-group-item-action">Painel Principal</a>
                            <a th:href="@{/aluno/meu_perfil}" class="list-group-item list-group-item-action"><i class="bi bi-person-circle"></i> Meu Perfil</a>
                            <a th:href="@{/aluno/meus_treinos}" class="list-group-item list-group-item-action active"><i class="bi bi-activity"></i> Meus Treinos</a>
                             <a th:href="@{/aluno/minhas_avaliacoes}" class="list-group-item list-group-item-action"><i class="bi bi-clipboard2-pulse-fill"></i></i> Avaliações</a>
                            <a th:href="@{/aluno/minhas_turmas}" class="list-group-item list-group-item-action"><i class="bi bi-person-lines-fill"></i> Minhas Turmas</a>
                             
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        <div class="col-md-9">
            <div class="d-flex align-items-center mb-4">
                <a th:href="@{/aluno/meus_treinos}" class="btn btn-secondary btn-sm me-3 btn-voltar-google">
                            <span class="material-symbols-outlined">arrow_back</span>
                            <span></span>
                        </a>
                <h1 class="mb-0 fw-bold">Plano de Treino</h1>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div>
                        <strong th:text="${plano.nome}">Treino A</strong>
                        <span class="text-muted ms-2" th:text="${#temporals.format(plano.dataCriacao, 'dd/MM/yyyy')}">10/12/2025</span>
                    </div>
                    <span class="badge bg-secondary info-content" th:text="${plano.diasSemana}">SEG,QUA,SEX</span>
                </div>
                <div class="card-body">
                    <div class="list-group">
                        <div th:each="ep : ${plano.exercicios}" class="list-group-item">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <strong th:text="${ep.exercicio.nome}">Exercício</strong>
                                    <span class="text-muted ms-2" th:text="'Séries: ' + ${ep.series} + ' | Reps: ' + ${ep.repeticoes}">Séries/Reps</span>
                                </div>
                                <span class="text-muted" th:text="${ep.carga != null} ? ('Carga: ' + ep.carga + ' kg') : ''"></span>
                            </div>
                            <div th:if="${ep.observacoes}" class="mt-2">
                                <small class="text-muted" th:text="${ep.observacoes}"></small>
                            </div>
                        </div>
                    </div>
                    <div th:if="${plano.observacoes}" class="mt-3">
                        <small class="text-muted" th:text="${plano.observacoes}"></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
