<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800&display=swap" rel="stylesheet">
</head>
<body data-role="aluno">
   <!--Cabeçalho-->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#45a049;">
        <div class="container">
            <a class="navbar-brand logo-text mb-0" th:href="@{/aluno/painel_principal}" style="font-size: 24px;">Academia <span>FatOut</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPerfil"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse justify-content-end" id="navPerfil">
            <div class="d-flex align-items-center profile-section">
                <div class="text-end me-3 d-none d-sm-block">
                    <small class="d-block text-white-50">Bem-vindo,</small>
                    <strong class="text-white" th:text="${aluno.nome}">João Silva</strong>
                </div>

                <div class="profile-nav-wrapper">
                    <img th:if="${aluno.fotoPerfil != null}" 
                         th:src="@{'/uploads/perfis/' + ${aluno.fotoPerfil}}" 
                         class="nav-avatar-modern">
                    <i th:unless="${aluno.fotoPerfil != null}" 
                       class="bi bi-person-circle nav-avatar-icon-modern"></i>
                </div>

                <a href="/" class="btn-sair-modern ms-3">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Menu -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Menu</h5>
                        <div class="list-group list-group-flush">
                            <a th:href="@{/aluno/painel_principal}" class="list-group-item list-group-item-action">Painel Principal</a>
                            <a th:href="@{/aluno/meu_perfil}" class="list-group-item list-group-item-action active"><i class="bi bi-person-circle"></i> Meu Perfil</a>
                            <a th:href="@{/aluno/meus_treinos}" class="list-group-item list-group-item-action"><i class="bi bi-activity"></i> Meus Treinos</a>
                            <a th:href="@{/aluno/minhas_avaliacoes}" class="list-group-item list-group-item-action"><i class="bi bi-clipboard2-pulse-fill"></i> Avaliações</a>
                            <a th:href="@{/aluno/minhas_turmas}" class="list-group-item list-group-item-action"><i class="bi bi-person-lines-fill"></i> Minhas Turmas</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
            <div class="d-flex align-items-center justify-content-between mb-4" style="height: 45px;">
                <div class="d-flex align-items-center">
                    <a th:href="@{/aluno/meu_perfil}" class="btn btn-secondary btn-sm me-3 btn-voltar-google">
                        <span class="material-symbols-outlined">arrow_back</span>
                    </a>
                    <h1 class="mb-0">Editar Perfil</h1>
                </div>
                <div class="ms-3 flash-slot">
                    <div th:if="${msgSucesso}" class="alert alert-success flash-alert mb-0" th:text="${msgSucesso}">Sucesso</div>
                    <div th:if="${msgErro}" class="alert alert-danger flash-alert mb-0" th:text="${msgErro}">Erro</div>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <form th:action="@{/aluno/perfil/editar}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="nome" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="nome" name="nome" th:value="${aluno.nome}" required>
                            </div>

                            <div class="col-md-6">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email" name="email" th:value="${aluno.email}" required>
                            </div>

                            <div class="col-md-6">
                                <label for="telefone" class="form-label">Telefone</label>
                                <input type="text" class="form-control" id="telefone" name="telefone" th:value="${aluno.telefone}">
                                <div class="invalid-feedback">Informe DDD + número com 11 dígitos.</div>
                            </div>

                            <div class="col-md-6">
                                <label for="objetivo" class="form-label">Objetivo</label>
                                <input type="text" class="form-control" id="objetivo" name="objetivo" th:value="${aluno.objetivo}">
                            </div>

                            <div class="col-md-6">
                                <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                                <input type="date" class="form-control" id="dataNascimento" name="dataNascimento" 
                                    th:value="${aluno.dataNascimento != null ? #temporals.format(aluno.dataNascimento, 'yyyy-MM-dd') : ''}">
                            </div>

                            <div class="col-md-6">
                                <label for="fotoPerfil" class="form-label">Foto de Perfil</label>
                                <div class="d-flex align-items-center gap-3">
                                    <img th:if="${aluno.fotoPerfil != null && !#strings.isEmpty(aluno.fotoPerfil)}" 
                                        th:src="@{'/uploads/perfis/' + ${aluno.fotoPerfil}}" 
                                        class="rounded-circle shadow-sm" style="width: 50px; height: 50px; object-fit: cover;">
                                    
                                
                                        
                                    <input type="file" class="form-control" id="fotoPerfil" name="file" accept="image/*">
                                </div>

                                <div th:if="${aluno.fotoPerfil != null && !#strings.isEmpty(aluno.fotoPerfil)}" class="form-check mt-2">
                                    <input class="form-check-input" type="checkbox" name="removerFoto" id="removerFoto" value="true">
                                    <label class="form-check-label text-danger" for="removerFoto">
                                        Remover foto atual
                                    </label>
                                </div>
                                <div class="form-text">Formatos: WebP, JPEG ou PNG. Máx: 2 MB.</div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/aluno/meu_perfil}" class="btn btn-warning">Cancelar</a>
                            <button type="submit" class="btn btn-outline-success">Salvar Alterações</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#telefone').mask('(00) 00000-0000');
            function validarTelefone(){
                var digits = $('#telefone').val().replace(/\D/g, '');
                var valido = (digits.length === 11) || (digits.length === 0);
                $('#telefone').toggleClass('is-invalid', !valido);
                $('form.card button[type="submit"]').prop('disabled', !valido);
            }
            validarTelefone();
            $('#telefone').on('input blur', validarTelefone);

            // Validação client-side do arquivo (tipo e tamanho)
            const maxBytes = 2 * 1024 * 1024; // 2 MB
            const tiposPermitidos = ['image/webp','image/jpeg','image/png'];
            const $file = $('#fotoPerfil');
            const $submit = $('form.card button[type="submit"]');
            $file.on('change', function(){
                const f = this.files && this.files[0];
                if (!f) return;
                const okTipo = tiposPermitidos.includes(f.type);
                const okTamanho = f.size <= maxBytes;
                if (!okTipo || !okTamanho) {
                    $file.addClass('is-invalid');
                    const msg = !okTipo ? 'Formato inválido (use WebP/JPEG/PNG).' : 'Arquivo acima de 2 MB.';
                    $file[0].setCustomValidity(msg);
                    $submit.prop('disabled', true);
                } else {
                    $file.removeClass('is-invalid');
                    $file[0].setCustomValidity('');
                    // reabilita apenas se telefone válido também
                    const digits = $('#telefone').val().replace(/\D/g, '');
                    const validoTel = (digits.length === 11) || (digits.length === 0);
                    $submit.prop('disabled', !validoTel);
                    // Preview da imagem
                    const url = URL.createObjectURL(f);
                    const img = document.getElementById('previewFoto');
                    img.src = url;
                    img.style.display = 'block';
                    img.onload = function(){ URL.revokeObjectURL(url); };
                }
            });
        });
    </script>
</body>
</html>
