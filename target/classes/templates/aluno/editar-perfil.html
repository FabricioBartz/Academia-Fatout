<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body data-role="aluno">
    <!--Nome do usuário-->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#45a049;">
        <div class="container">
            <a class="navbar-brand" href="#">Academia FatOut</a>
            <div class="navbar-text text-white d-flex align-items-center"><span class="me-3">Aluno: <strong th:text="${aluno.nome}">João Silva</strong></span>
                 <div class="profile-nav-container me-3"><img th:if="${aluno.fotoPerfil != null && !#strings.isEmpty(aluno.fotoPerfil)}" th:src="@{'/uploads/perfis/' + ${aluno.fotoPerfil} + '?v=' + ${#dates.createNow().time}}" alt="Foto" class="nav-avatar">
                    <i th:unless="${aluno.fotoPerfil != null && !#strings.isEmpty(aluno.fotoPerfil)}" class="bi bi-person-circle nav-avatar-icon"></i>
                </div>
                <a href="/" class="btn btn-outline-dark btn-sm">Sair</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-0">
            <!-- Menu -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Menu</h5>
                        <div class="list-group list-group-flush">
                            <a th:href="@{/aluno/painel_principal}" class="list-group-item list-group-item-action">Painel Principal</a>
                            <a th:href="@{/aluno/meu_perfil}" class="list-group-item list-group-item-action active"><i class="bi bi-person-circle"></i> Meu Perfil</a>
                            <a th:href="@{/aluno/meus_treinos}" class="list-group-item list-group-item-action"><i class="bi bi-activity"></i> Meus Treinos</a>
                            <a th:href="@{/aluno/minhas_avaliacoes}" class="list-group-item list-group-item-action"><i class="bi bi-clipboard2-pulse-fill"></i> Avaliações</a>
                            <a th:href="@{/aluno/minhas_turmas}" class="list-group-item list-group-item-action"><i class="bi bi-person-lines-fill"></i> Minhas Turmas</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="d-flex align-items-center justify-content-between mb-4" style="height: 45px;">
                    <div class="d-flex align-items-center">
                        <a th:href="@{/aluno/meu_perfil}" class="btn btn-secondary btn-sm me-3 btn-voltar-google">
                            <span class="material-symbols-outlined">arrow_back</span>
                            <span></span>
                        </a>
                        <h1 class="mb-0">Editar Perfil</h1>
                        <span class="text-muted ms-3" th:text="${aluno.nome}">João Silva</span>
                    </div>
                    <div class="ms-3">
                        <div th:if="${msgSucesso}" class="alert alert-success mb-0" th:text="${msgSucesso}">Sucesso</div>
                        <div th:if="${msgErro}" class="alert alert-danger mb-0" th:text="${msgErro}">Erro</div>
                    </div>
                </div>

                <form th:action="@{/aluno/perfil/editar}" method="post" enctype="multipart/form-data" class="card p-3 mt-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="mb-2">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" name="nome" th:value="${aluno.nome}" required>
                    </div>

                    <div class="mb-2">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" th:value="${aluno.email}" required>
                    </div>

                    <div class="mb-2">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="text" class="form-control" id="telefone" name="telefone" th:value="${aluno.telefone}">
                        <div class="invalid-feedback">Informe DDD + número com 11 dígitos.</div>
                    </div>

                    <div class="mb-2">
                        <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                        <input type="date" class="form-control" id="dataNascimento" name="dataNascimento" th:value="${#temporals.format(aluno.dataNascimento, 'yyyy-MM-dd')}">
                    </div>

                    <div class="mb-2">
                        <label for="objetivo" class="form-label">Objetivo</label>
                        <input type="text" class="form-control" id="objetivo" name="objetivo" th:value="${aluno.objetivo}">
                    </div>

                    <div class="mb-2">
                        <label for="fotoPerfil" class="form-label">Foto de Perfil</label>
                        <input type="file" class="form-control form-control-pesquisa" id="fotoPerfil" name="file" accept="image/webp,image/jpeg,image/png">
                        <div class="form-text">Formatos: WebP, JPEG ou PNG. Tamanho máx.: 2 MB.</div>
                        <div class="mt-2">
                            <img id="previewFoto" src="#" alt="Pré-visualização" class="avatar-150" style="display:none;"/>
                        </div>
                        <div th:if="${aluno.fotoPerfil != null && !#strings.isEmpty(aluno.fotoPerfil)}" class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" name="removerFoto" id="removerFoto" value="true">
                            <label class="form-check-label text-danger" for="removerFoto">
                                Remover foto atual
                            </label>
                        </div>
                    </div>

                    <div class="mt-2">
                        <a th:href="@{/aluno/meu_perfil}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-outline-success">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#telefone').mask('(00) 00000-0000');
            function validarTelefone(){
                var digits = $('#telefone').val().replace(/\D/g, '');
                var valido = (digits.length === 11) || (digits.length === 0);
                $('#telefone').toggleClass('is-invalid', !valido);
                $('form.card button[type="submit"]').prop('disabled', !valido);
            }
            validarTelefone();
            $('#telefone').on('input blur', validarTelefone);

            // Validação client-side do arquivo (tipo e tamanho)
            const maxBytes = 2 * 1024 * 1024; // 2 MB
            const tiposPermitidos = ['image/webp','image/jpeg','image/png'];
            const $file = $('#fotoPerfil');
            const $submit = $('form.card button[type="submit"]');
            $file.on('change', function(){
                const f = this.files && this.files[0];
                if (!f) return;
                const okTipo = tiposPermitidos.includes(f.type);
                const okTamanho = f.size <= maxBytes;
                if (!okTipo || !okTamanho) {
                    $file.addClass('is-invalid');
                    const msg = !okTipo ? 'Formato inválido (use WebP/JPEG/PNG).' : 'Arquivo acima de 2 MB.';
                    $file[0].setCustomValidity(msg);
                    $submit.prop('disabled', true);
                } else {
                    $file.removeClass('is-invalid');
                    $file[0].setCustomValidity('');
                    // reabilita apenas se telefone válido também
                    const digits = $('#telefone').val().replace(/\D/g, '');
                    const validoTel = (digits.length === 11) || (digits.length === 0);
                    $submit.prop('disabled', !validoTel);
                    // Preview da imagem
                    const url = URL.createObjectURL(f);
                    const img = document.getElementById('previewFoto');
                    img.src = url;
                    img.style.display = 'block';
                    img.onload = function(){ URL.revokeObjectURL(url); };
                }
            });
        });
    </script>
</body>
</html>
