<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body data-role="aluno">
    <!--Nome do usuário-->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#45a049;">
        <div class="container">
            <a class="navbar-brand" href="#">Academia FatOut</a>
            <div class="navbar-text text-white d-flex align-items-center"><span class="me-3">Aluno: <strong th:text="${aluno.nome}">João Silva</strong></span>
                 <div class="profile-nav-container me-3"><img th:if="${aluno.fotoPerfil != null && !#strings.isEmpty(aluno.fotoPerfil)}" th:src="@{'/uploads/perfis/' + ${aluno.fotoPerfil} + '?v=' + ${#dates.createNow().time}}" alt="Foto" class="nav-avatar">
                    <i th:unless="${aluno.fotoPerfil != null && !#strings.isEmpty(aluno.fotoPerfil)}" class="bi bi-person-circle nav-avatar-icon"></i>
                </div>
                <a href="/" class="btn btn-outline-dark btn-sm">Sair</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
<div class="row">
            <!-- Menu -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Menu</h5>
                        <div class="list-group list-group-flush">
                            <a th:href="@{/aluno/painel_principal}" class="list-group-item list-group-item-action">Painel Principal</a>
                            <a th:href="@{/aluno/meu_perfil}" class="list-group-item list-group-item-action active"><i class="bi bi-person-circle"></i> Meu Perfil</a>
                            <a th:href="@{/aluno/meus_treinos}" class="list-group-item list-group-item-action"><i class="bi bi-activity"></i> Meus Treinos</a>
                             <a th:href="@{/aluno/minhas_avaliacoes}" class="list-group-item list-group-item-action"><i class="bi bi-clipboard2-pulse-fill"></i></i> Avaliações</a>
                            <a th:href="@{/aluno/minhas_turmas}" class="list-group-item list-group-item-action"><i class="bi bi-person-lines-fill"></i> Minhas Turmas</a>
                             
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <h1 class="mb-0">Meu Perfil</h1>
                    <div class="d-flex align-items-center gap-2">
                        <div th:if="${msgSucesso}" class="alert alert-success flash-alert mb-0" th:text="${msgSucesso}">Sucesso</div>
                        <div th:if="${msgErro}" class="alert alert-danger flash-alert mb-0" th:text="${msgErro}">Erro</div>
                    </div>
                </div> <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="row g-3 align-items-start">
                            <div class="col-md-8">
                                <h4 class="mb-1" th:text="${aluno.nome}">Nome Aluno</h4>
                                <div class="text-muted mb-3" th:text="${aluno.email}">email@academia.com</div>
                                <hr>

                                <div class="row">
                                    
                                    <div class="col-md-6 mb-3">
                                        <p><strong>Telefone:</strong> 
                                            <span th:text="${aluno.telefone != null && aluno.telefone.replaceAll('\D', '').length() == 11 ? '(' + aluno.telefone.substring(0,2) + ') ' + aluno.telefone.substring(2,7) + '-' + aluno.telefone.substring(7,11) : aluno.telefone}">(11) 98765-4321</span>
                                        </p>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <p><strong>Data de Nascimento:</strong> 
                                            <span th:text="${#temporals.format(aluno.dataNascimento, 'dd/MM/yyyy')}">14/03/1995</span>
                                        </p>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <p><strong>Objetivo:</strong> 
                                            <span th:text="${aluno.objetivo}">objetivo</span>
                                        </p>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <p><strong>Início na Academia:</strong> 
                                            <span th:text="${aluno.dataCadastro != null ? #temporals.format(aluno.dataCadastro, 'dd/MM/yyyy') : '—'}">—</span>
                                        </p>
                                    </div>
                                </div>
                                <hr>
                                
                                <div class="d-flex gap-2">
                                    <a th:href="@{/aluno/perfil/editar}" class="btn btn-warning rounded-pill px-4">Editar Perfil</a>
                                </div>
                            </div>

                            <div class="col-md-4 d-flex align-items-center justify-content-center" style="padding-top: 40px !important;">
                                <div class="d-flex flex-column align-items-center">
                                    <div th:if="${aluno.fotoPerfil != null && !#strings.isEmpty(aluno.fotoPerfil)}">
                                        <img th:src="@{'/uploads/perfis/' + ${aluno.fotoPerfil} + '?v=' + ${#dates.createNow().time}}" alt="Foto do Aluno" class="avatar-150"/>
                                    </div>
                                    <div th:unless="${aluno.fotoPerfil != null && !#strings.isEmpty(aluno.fotoPerfil)}">
                                        <i class="bi bi-person-circle avatar-icon-150" style="font-size: 150px;"></i>
                                    </div>
                                    <div class="mt-2 text-muted" style="font-size: 0.9rem;">Foto de Perfil</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-dismiss para mensagens flash
        document.addEventListener('DOMContentLoaded', function() {
            const alerts = document.querySelectorAll('.flash-alert');
            alerts.forEach(a => {
                setTimeout(() => {
                    a.classList.add('fade');
                    a.style.opacity = '0';
                    setTimeout(() => a.remove(), 300);
                }, 2000);
            });
        });
    </script>
</body>
</html>
