<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body data-role="aluno">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#45a049;">
        <div class="container">
            <a class="navbar-brand" href="#">Academia FatOut</a>
            <div class="navbar-text text-white">
                Aluno: <span th:text="${aluno.nome}">João Silva</span>
                <a href="/" class="btn btn-outline-dark btn-sm ms-3">Sair</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
<div class="row">
            <!-- Menu -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Menu</h5>
                        <div class="list-group list-group-flush">
                            <a th:href="@{/aluno/painel_principal}" class="list-group-item list-group-item-action">Painel Principal</a>
                            <a th:href="@{/aluno/meu_perfil}" class="list-group-item list-group-item-action active"><i class="bi bi-person-circle"></i> Meu Perfil</a>
                            <a th:href="@{/aluno/meus_treinos}" class="list-group-item list-group-item-action"><i class="bi bi-activity"></i> Meus Treinos</a>
                             <a th:href="@{/aluno/minhas_avaliacoes}" class="list-group-item list-group-item-action"><i class="bi bi-clipboard2-pulse-fill"></i></i> Avaliações</a>
                            <a th:href="@{/aluno/minhas_turmas}" class="list-group-item list-group-item-action"><i class="bi bi-person-lines-fill"></i> Minhas Turmas</a>
                             
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <h1 class="mb-0">[[${aluno.nome}]]</h1>
                    <div th:if="${msgSucesso}" class="alert alert-success flash-alert mb-0" th:text="${msgSucesso}">Sucesso</div>
                    <div th:if="${msgErro}" class="alert alert-danger flash-alert mb-0" th:text="${msgErro}">Erro</div>
                    <a th:href="@{/aluno/perfil/editar}" class="btn btn-outline-success btn-sm"> Editar</a>
                </div>
                
                <div class="row g-3">
                    <div class="col-md-8">
                        <div class="card h-100">
                            <div class="card-body">
                                <p class="card-text"><strong>Email:</strong> <span th:text="${aluno.email}">email</span></p>
                                <p class="card-text"><strong>Telefone:</strong><span th:text="${aluno.telefone != null && aluno.telefone.length() == 11 ? aluno.telefone.replaceAll('(\\d{2})(\\d{5})(\\d{4})', '($1) $2-$3') : aluno.telefone}"> (11) 99999-8888</span></p>
                                <p class="card-text"><strong>Data de Nascimento:</strong><span th:text="${#temporals.format(aluno.dataNascimento, ' dd/MM/yyyy')}">14/03/1995</span></p>
                                <p class="card-text"><strong>Objetivo:</strong> <span th:text="${aluno.objetivo}">objetivo</span></p>
                                <p class="card-text"><strong>Início na Academia:</strong>
                                    <span th:text="${inicioAluno != null ? #temporals.format(inicioAluno, 'dd/MM/yyyy') : '—'}">—</span>
                                </p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card h-100 d-flex align-items-center justify-content-center pt-4">
                            <div class="card-body d-flex flex-column align-items-center justify-content-center">
                                <div th:if="${aluno.fotoPerfil != null && !#strings.isEmpty(aluno.fotoPerfil)}">
                                    <img th:src="@{/uploads/perfis/{fn}(fn=${aluno.fotoPerfil}, v=${#dates.createNow().time})}" alt="Foto do Aluno" class="avatar-150"/></div>
                                <div th:if="${aluno.fotoPerfil == null || #strings.isEmpty(aluno.fotoPerfil)}"><i class="bi bi-person-circle avatar-icon-150"></i></div>
                                <div class="mt-2 text-muted" style="font-size: 0.9rem;">Foto de Perfil</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Auto-dismiss para mensagens flash
        document.addEventListener('DOMContentLoaded', function() {
            const alerts = document.querySelectorAll('.flash-alert');
            alerts.forEach(a => {
                setTimeout(() => {
                    a.classList.add('fade');
                    a.style.opacity = '0';
                    setTimeout(() => a.remove(), 300);
                }, 2000);
            });
        });
    </script>
</body>
</html>
