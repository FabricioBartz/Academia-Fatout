<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body data-role="aluno">
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#45a049;">
        <div class="container">
            <a class="navbar-brand" href="#">🏋️ Academia FatOut</a>
            <div class="navbar-text text-white">
                Aluno: <span th:text="${aluno.nome}">João Silva</span>
                <a href="/" class="btn btn-outline-dark btn-sm ms-3">Sair</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
<div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Menu</h5>
                        <div class="list-group list-group-flush">

                            <a th:href="@{/aluno/painel_principal}" class="list-group-item list-group-item-action">Painel Principal</a>
                            <a th:href="@{/aluno/meu_perfil}" class="list-group-item list-group-item-action active active">👤 Meu Perfil</a>
                            <a th:href="@{/aluno/meus_treinos}" class="list-group-item list-group-item-action">💪 Meus Treinos</a>
                             <a th:href="@{/aluno/minhas_avaliacoes}" class="list-group-item list-group-item-action">📊 Avaliações</a>
                            <a th:href="@{/aluno/minhas_turmas}" class="list-group-item list-group-item-action">👥 Minhas Turmas</a>
                             
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <h1>[[${aluno.nome}]]</h1> <!--como eu faço para aparecer o nome do aluo aqui?"-->

                <div class="card">
                    <div class="card-body">
                        
                        <p class="card-text"><strong>Email:</strong> <span th:text="${aluno.email}">email</span></p>
                        <p class="card-text"><strong>Telefone:</strong><span th:text="${aluno.telefone != null && aluno.telefone.length() == 11 ? aluno.telefone.replaceAll('(\d{2})(\d{5})(\d{4})', '($1) $2-$3') : aluno.telefone}"> (11) 99999-8888</span></p>
                        <p class="card-text"><strong>Data de Nascimento:</strong><span th:text="${#temporals.format(aluno.dataNascimento, ' dd/MM/yyyy')}">14/03/1995</span></p>
                        <p class="card-text"><strong>Objetivo:</strong> <span th:text="${aluno.objetivo}">objetivo</span></p>
                        <p class="card-text"><strong>Início na Academia:</strong>
                            <span th:text="${inicioAluno != null ? #temporals.format(inicioAluno, 'dd/MM/yyyy') : '—'}">—</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
