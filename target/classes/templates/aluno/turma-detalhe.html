<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800&display=swap" rel="stylesheet">
</head>
<body data-role="aluno">
    <!--Cabeçalho-->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#45a049;">
        <div class="container">
            <a class="navbar-brand logo-text mb-0" th:href="@{/aluno/painel_principal}" style="font-size: 24px;">Academia <span>FatOut</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPerfil"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse justify-content-end" id="navPerfil">
            <div class="d-flex align-items-center profile-section">
                <div class="text-end me-3 d-none d-sm-block">
                    <small class="d-block text-white-50">Bem-vindo,</small>
                    <strong class="text-white" th:text="${aluno.nome}">João Silva</strong>
                </div>

                <div class="profile-nav-wrapper">
                    <img th:if="${aluno.fotoPerfil != null}" 
                         th:src="@{'/uploads/perfis/' + ${aluno.fotoPerfil}}" 
                         class="nav-avatar-modern">
                    <i th:unless="${aluno.fotoPerfil != null}" 
                       class="bi bi-person-circle nav-avatar-icon-modern"></i>
                </div>

                <a href="/" class="btn-sair-modern ms-3">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            </div>
            </div>
        </div>
    </nav>

<div class="container mt-4">
    <div class="row">
        <!-- Menu -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Menu</h5>
                        <div class="list-group list-group-flush">
                            <a th:href="@{/aluno/painel_principal}" class="list-group-item list-group-item-action">Painel Principal</a>
                            <a th:href="@{/aluno/meu_perfil}" class="list-group-item list-group-item-action"><i class="bi bi-person-circle"></i> Meu Perfil</a>
                            <a th:href="@{/aluno/meus_treinos}" class="list-group-item list-group-item-action"><i class="bi bi-activity"></i> Meus Treinos</a>
                             <a th:href="@{/aluno/minhas_avaliacoes}" class="list-group-item list-group-item-action"><i class="bi bi-clipboard2-pulse-fill"></i></i> Avaliações</a>
                            <a th:href="@{/aluno/minhas_turmas}" class="list-group-item list-group-item-action active"><i class="bi bi-person-lines-fill"></i> Minhas Turmas</a>
                             
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        <div class="col-md-9">
            <div class="d-flex align-items-center justify-content-between mb-3">
                
                <div class="d-flex align-items-center">
                    <a th:href="${backUrl}" class="btn btn-secondary btn-sm me-3 btn-voltar-google">
                        <span class="material-symbols-outlined">arrow_back</span>
                    </a>
                    <h1 class="mb-0 fw-bold">Detalhe da Turma</h1>
                </div>

                <div class="d-flex align-items-center">
                    <div th:if="${turmasMatriculadasIds != null && turmasMatriculadasIds.contains(turma.id)}">
                        <form th:action="@{/aluno/turmas/desmatricular/{id}(id=${turma.id})}" method="post" onsubmit="return handleConfirmSubmit(event)" data-confirm="Confirmar desmatrícula desta turma?" style="margin-bottom:0;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-outline-danger btn-sm btn-matricula">Desmatricular</button>
                        </form>
                    </div>
                    <div th:if="${turmasMatriculadasIds == null || !turmasMatriculadasIds.contains(turma.id)}">
                        <form th:action="@{/aluno/turmas/matricular/{id}(id=${turma.id})}" method="post" onsubmit="return handleConfirmSubmit(event)" data-confirm="Confirmar matrícula nesta turma?" style="margin-bottom:0;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-outline-success btn-sm btn-matricula" th:disabled="${turma.vagasDisponiveis == 0}">Matricular</button>
                        </form>
                    </div>
                </div>

            </div>
    
            

            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title mb-1" th:text="${turma.titulo}">Título</h5>
                    <p class="text-muted mb-3" th:text="${turma.descricao}">Descrição</p>
                    <hr>
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <p><strong>Data:</strong> <span th:text="${#temporals.format(turma.dataDaAula,'dd/MM/yyyy')}">01/01/2025</span></p>
                        </div>
                        <div class="col-md-6 mb-2">
                            <p><strong>Hora:</strong> <span th:text="${#temporals.format(turma.horaAula,'HH:mm')}">10:00</span></p>
                        </div>
                        <div class="col-md-6 mb-2">
                            <p><strong>Vagas:</strong> <span th:text="${turma.vagas}">20</span></p>
                        </div>
                        <div class="col-md-6 mb-2">
                            <p><strong>Vagas Disponíveis:</strong> <span class="badge bg-secondary" th:text="${turma.vagasDisponiveis}">10</span></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Alunos Matriculados</h5>
                    <div th:if="${alunosTurma == null || #lists.isEmpty(alunosTurma)}" class="text-muted">Nenhum aluno matriculado.</div>
                    <ul class="list-group" th:if="${alunosTurma != null && !#lists.isEmpty(alunosTurma)}">
                        <li class="list-group-item" th:each="a : ${alunosTurma}" th:text="${a.nome}">João Silva</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/confirm-modal.js}"></script>
</body>
</html>
