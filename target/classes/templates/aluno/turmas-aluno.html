<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body data-role="aluno">
    <!--Nome do usuário-->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#45a049;">
        <div class="container">
            <a class="navbar-brand" href="#">Academia FatOut</a>
            <div class="navbar-text text-white d-flex align-items-center"><span class="me-3">Aluno: <strong th:text="${aluno.nome}">João Silva</strong></span>
                 <div class="profile-nav-container me-3"><img th:if="${aluno.fotoPerfil != null && !#strings.isEmpty(aluno.fotoPerfil)}" th:src="@{'/uploads/perfis/' + ${aluno.fotoPerfil} + '?v=' + ${#dates.createNow().time}}" alt="Foto" class="nav-avatar">
                    <i th:unless="${aluno.fotoPerfil != null && !#strings.isEmpty(aluno.fotoPerfil)}" class="bi bi-person-circle nav-avatar-icon"></i>
                </div>
                <a href="/" class="btn btn-outline-dark btn-sm">Sair</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <!-- Menu -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Menu</h5>
                        <div class="list-group list-group-flush">
                            <a th:href="@{/aluno/painel_principal}" class="list-group-item list-group-item-action">Painel Principal</a>
                            <a th:href="@{/aluno/meu_perfil}" class="list-group-item list-group-item-action"><i class="bi bi-person-circle"></i> Meu Perfil</a>
                            <a th:href="@{/aluno/meus_treinos}" class="list-group-item list-group-item-action"><i class="bi bi-activity"></i> Meus Treinos</a>
                             <a th:href="@{/aluno/minhas_avaliacoes}" class="list-group-item list-group-item-action"><i class="bi bi-clipboard2-pulse-fill"></i></i> Avaliações</a>
                            <a th:href="@{/aluno/minhas_turmas}" class="list-group-item list-group-item-action active"><i class="bi bi-person-lines-fill"></i> Minhas Turmas</a>
                             
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-9">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <h1 class="mb-0">Minhas Turmas</h1>
                    <div class="ms-3" style="min-height:2rem;">
                        <div th:if="${msgSucesso}" class="alert alert-success fade show py-1 px-2 mb-0 flash-alert" role="alert">
                            <span th:text="${msgSucesso}"></span>
                        </div>
                        <div th:if="${msgErro}" class="alert alert-danger fade show py-1 px-2 mb-0 flash-alert" role="alert">
                            <span th:text="${msgErro}"></span>
                        </div>
                    </div>
                </div>
                <p class="text-muted">Turmas em que você está matriculado.</p>

                <div th:if="${turmasMatriculadas == null || #lists.isEmpty(turmasMatriculadas)}" class="alert alert-warning">
                    Você ainda não está matriculado em nenhuma turma.
                </div>

                <div th:if="${turmasMatriculadas != null && !#lists.isEmpty(turmasMatriculadas)}" class="mb-4">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Instrutor</th>
                                    <th>Data</th>
                                    <th>Hora</th>
                                    <th>Ação</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="t : ${turmasMatriculadas}" class="table-row" style="cursor:pointer;" th:attr="data-href=@{/aluno/turmas/{id}(id=${t.id})}">
                                    <td th:text="${t.titulo}">Nome</td>
                                    <td th:text="${t.instrutor != null ? t.instrutor.nome : '—'}">Instrutor</td>
                                    <td th:text="${#temporals.format(t.dataDaAula,'dd/MM/yyyy')}">01/01/2025</td>
                                    <td th:text="${#temporals.format(t.horaAula,'HH:mm')}">10:00</td>
                                    <td>
                                        <form th:action="@{/aluno/turmas/desmatricular/{id}(id=${t.id})}" method="post" onsubmit="return handleConfirmSubmit(event)" data-confirm="Deseja desmatricular-se desta turma?">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <button type="submit" class="btn btn-outline-danger btn-sm">Desmatricular</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="d-flex justify-content-end align-items-center">
                    
                    <a th:href="@{/aluno/turmas/disponiveis}" class="btn btn-outline-success btn-sm">Ver Turmas Disponíveis</a>
                </div>
            </div>
        </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/confirm-modal.js}"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function(){
                const alerts = document.querySelectorAll('.flash-alert');
                alerts.forEach(function(el){
                    setTimeout(function(){
                        try {
                            const instance = bootstrap.Alert.getOrCreateInstance(el);
                            instance.close();
                        } catch(e) {
                            // fallback remove
                            el.classList.remove('show');
                            el.addEventListener('transitionend', () => el.remove(), { once: true });
                            setTimeout(() => el.remove(), 500);
                        }
                    }, 2000);
                });
                // tornar linhas clicáveis sem interferir em botões/forms
                document.querySelectorAll('.table-row').forEach(function(row){
                    row.addEventListener('click', function(e){
                        if (e.target.closest('button') || e.target.closest('form')) return;
                        const href = row.getAttribute('data-href');
                        if (href) window.location.href = href;
                    });
                });
            });
        </script>
    </body>
</html>
