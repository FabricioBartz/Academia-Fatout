<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body data-role="instrutor">
<!--Nome do usuário-->
   <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
             <a class="navbar-brand" href="#">Academia FatOut</a>
                <div class="navbar-text text-white d-flex align-items-center"><span class="me-3">Instrutor: <strong th:text="${instrutor.nome}">Carlos Silva</strong></span>
                    <div class="profile-nav-container me-3"><img th:if="${instrutor.fotoPerfil != null && !#strings.isEmpty(instrutor.fotoPerfil)}" th:src="@{'/uploads/perfis/' + ${instrutor.fotoPerfil}}" alt="Foto" class="nav-avatar">
                    <i th:unless="${instrutor.fotoPerfil != null && !#strings.isEmpty(instrutor.fotoPerfil)}" class="bi bi-person-circle nav-avatar-icon"></i>
                </div>
                <a href="/" class="btn btn-outline-dark btn-sm">Sair</a>
                </div>
        </div>
    </nav>

<div class="container mt-4">
    <div class="row">
            <!-- Menu -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Menu</h5>
                        <div class="list-group list-group-flush">
                            <a th:href="@{/instrutor/painel_principal}" class="list-group-item list-group-item-action">Painel Principal</a>
                            <a th:href="@{/instrutor/meus_alunos}" class="list-group-item list-group-item-action active"><i class="bi bi-people-fill"></i> Meus Alunos</a>
                            <a th:href="@{/instrutor/minhas_turmas}" class="list-group-item list-group-item-action"><i class="bi bi-person-lines-fill"></i> Minhas Turmas</a>
                            <a th:href="@{/instrutor/exercicios}" class="list-group-item list-group-item-action"><i class="bi bi-activity"></i> Exercícios</a>
                            <a th:if="${instrutor.admin}" th:href="@{/instrutor/instrutores}" class="list-group-item list-group-item-action"><i class="bi bi-person-badge-fill"></i> Instrutores</a>
                        </div>
                    </div>
                </div>
            </div>

        <div class="col-md-9">
            <div class="d-flex align-items-center justify-content-between mb-4" style="height: 45px;">
                <div class="d-flex align-items-center">
                    <a th:href="@{/instrutor/alunos/perfil/{cpf}(cpf=${aluno.cpf})}" class="btn btn-secondary btn-sm me-3 btn-voltar-google">
                        <span class="material-symbols-outlined">arrow_back</span>
                        <span></span>
                    </a>
                    <h1 class="mb-0">Plano de Treino</h1>
                    <span class="text-muted ms-3" th:text="${aluno.nome}">João Silva</span>
                </div>
                <div class="ms-3 flash-slot">
                    <div th:if="${msgSucesso}" class="alert alert-success flash-alert mb-0" th:text="${msgSucesso}">Sucesso</div>
                    <div th:if="${msgErro}" class="alert alert-danger flash-alert mb-0" th:text="${msgErro}">Erro</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between">
                    <div>
                        <strong th:text="${plano.nome}">Treino A</strong>
                        <span class="text-muted ms-2" th:text="${#temporals.format(plano.dataCriacao, 'dd/MM/yyyy')}">10/12/2025</span>
                    </div>
                    <span class="badge bg-secondary" th:text="${plano.diasSemana}">SEG,QUA,SEX</span>
                </div>
                <div class="card-body">
                    <div class="list-group">
                        <div th:each="ep : ${plano.exercicios}" class="list-group-item">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <strong th:text="${ep.exercicio.nome}">Supino</strong>
                                    <span class="text-muted ms-2" th:text="'Séries: ' + ${ep.series} + ' | Reps: ' + ${ep.repeticoes}">Séries/Reps</span>
                                </div>
                                <span class="text-muted" th:if="${ep.carga != null}" th:text="'Carga: ' + ${ep.carga} + ' kg'"></span>
                            </div>
                            <div th:if="${ep.observacoes}" class="mt-2">
                                <small class="text-muted" th:text="${ep.observacoes}"></small>
                            </div>
                        </div>
                    </div>
                    <div th:if="${plano.observacoes}" class="mt-3">
                        <small class="text-muted" th:text="${plano.observacoes}">Obs</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const alerts = document.querySelectorAll('.flash-alert');
    alerts.forEach(a => {
        setTimeout(() => {
            a.classList.add('fade');
            a.style.opacity = '0';
            setTimeout(() => a.remove(), 300);
        }, 2000);
    });
});
</script>
</body>
</html>
