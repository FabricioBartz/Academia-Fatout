<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Instrutor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">🏋️ Academia FatOut</a>
            <div class="navbar-text text-white">
                Instrutor: <span th:text="${instrutor.nome}">Carlos Silva</span>
                <a href="/" class="btn btn-dark btn-sm ms-3">Sair</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row mb-0">
            <!-- Sidebar -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Menu</h5>
                        <div class="list-group list-group-flush">
                            <a th:href="@{/instrutor/dashboard}" class="list-group-item list-group-item-action">
                                  Painel Principal
                            </a>
                            <a th:href="@{/instrutor/alunos}" class="list-group-item list-group-item-action active">
                                👥 Meus Alunos
                            </a>
                            <a th:href="@{/instrutor/turmas}" class="list-group-item list-group-item-action">
                                🏋️ Minhas Turmas
                            </a>
                            <a th:href="@{/instrutor/exercicios}" class="list-group-item list-group-item-action">
                                💪 Exercícios
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <div class="d-flex align-items-center mb-4">
                    <a th:href="@{/instrutor/alunos/perfil/{cpf}(cpf=${aluno.cpf})}" class="btn btn-secondary btn-sm me-3">← Voltar</a>
                    <h1 class="mb-0">Editar Aluno</h1>
                    <span class="text-muted ms-3" th:text="${aluno.nome}">João Silva</span>
                </div>
                <!-- Form na mesma coluna para remover qualquer espaço entre título e conteúdo -->
                <form th:action="@{/instrutor/alunos/editar/{cpf}(cpf=${aluno.cpf})}" method="post" class="card p-3 mt-0">
                    
                    <div th:if="${error}" class="alert alert-danger mb-2" th:text="${error}"></div>
                    
                    <div class="mb-2">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" name="nome" th:value="${aluno.nome}" required>
                    </div>
                    
                    <div class="mb-2">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" th:value="${aluno.email}" required>
                    </div>
                    
                    <div class="mb-2">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="text" class="form-control" id="telefone" name="telefone" th:value="${aluno.telefone}">
                    </div>
                    
                    <div class="mb-2">
                        <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                        <input type="date" class="form-control" id="dataNascimento" name="dataNascimento" 
                               th:value="${#temporals.format(aluno.dataNascimento, 'yyyy-MM-dd')}">
                    </div>
                    
                    <div class="mb-2">
                        <label for="objetivo" class="form-label">Objetivo</label>
                        <input type="text" class="form-control" id="objetivo" name="objetivo" th:value="${aluno.objetivo}">
                    </div>
                    
                    <div class="mt-2">
                        <a th:href="@{/instrutor/alunos/perfil/{cpf}(cpf=${aluno.cpf})}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
