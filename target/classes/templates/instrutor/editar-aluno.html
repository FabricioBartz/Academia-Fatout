<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800&display=swap" rel="stylesheet">
</head>
<body data-role="instrutor">
<!--Cabeçalho-->
   <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand logo-text mb-0" th:href="@{/instrutor/painel_principal}" style="font-size: 24px;">Academia <span>FatOut</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPerfil"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse justify-content-end" id="navPerfil">
            <div class="d-flex align-items-center profile-section">
                <div class="text-end me-3 d-none d-sm-block">
                    <small class="d-block text-white-50">Bem-vindo,</small>
                    <strong class="text-white" th:text="${instrutor.nome}">Carlos Silva</strong>
                </div>
                <div class="profile-nav-wrapper">
                    <img th:if="${instrutor.fotoPerfil != null}" 
                         th:src="@{'/uploads/perfis/' + ${instrutor.fotoPerfil}}" 
                         class="nav-avatar-modern">
                    <i th:unless="${instrutor.fotoPerfil != null}" 
                       class="bi bi-person-circle nav-avatar-icon-modern"></i>
                </div>

                <a href="/" class="btn-sair-modern ms-3">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            </div>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row mb-0">
                <!-- Menu -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Menu</h5>
                        <div class="list-group list-group-flush">
                            <a th:href="@{/instrutor/painel_principal}" class="list-group-item list-group-item-action">Painel Principal</a>
                            <a th:href="@{/instrutor/meu_perfil}" class="list-group-item list-group-item-action"><i class="bi bi-person-circle"></i> Meu Perfil</a>
                            <a th:href="@{/instrutor/meus_alunos}" class="list-group-item list-group-item-action active"><i class="bi bi-people-fill"></i> Meus Alunos</a>
                            <a th:href="@{/instrutor/minhas_turmas}" class="list-group-item list-group-item-action"><i class="bi bi-person-lines-fill"></i> Minhas Turmas</a>
                            <a th:href="@{/instrutor/exercicios}" class="list-group-item list-group-item-action"><i class="bi bi-activity"></i> Exercícios</a>
                            <a th:if="${instrutor.admin}" th:href="@{/instrutor/instrutores}" class="list-group-item list-group-item-action"><i class="bi bi-person-badge-fill"></i> Instrutores</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <div class="d-flex align-items-center justify-content-between mb-4" style="height: 45px;">
                    <div class="d-flex align-items-center">
                        <a th:href="@{/instrutor/alunos/perfil/{cpf}(cpf=${aluno.cpf})}" class="btn btn-secondary btn-sm me-3 btn-voltar-google">
                            <span class="material-symbols-outlined">arrow_back</span>
                            <span></span>
                        </a>
                        <h1 class="mb-0 fw-bold">Editar Aluno</h1>
                        <span class="text-muted ms-3" th:text="${aluno.nome}">João Silva</span>
                    </div>
                    <div class="ms-3 flash-slot">
                        <div th:if="${msgSucesso}" class="alert alert-success flash-alert mb-0" th:text="${msgSucesso}">Sucesso</div>
                        <div th:if="${msgErro}" class="alert alert-danger flash-alert mb-0" th:text="${msgErro}">Erro</div>
                    </div>
                </div>
                <!-- Form na mesma coluna para remover qualquer espaço entre título e conteúdo -->
                 
                        <form th:action="@{/instrutor/alunos/editar/{cpf}(cpf=${aluno.cpf})}" method="post" enctype="multipart/form-data" class="card p-3 mt-0">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            
                            <div th:if="${error}" class="alert alert-danger mb-2" th:text="${error}"></div>

                            <div class="row g-3">

                            <div class="col-md-6">
                                <label for="nome" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="nome" name="nome" th:value="${aluno.nome}" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" th:value="${aluno.email}" required>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="telefone" class="form-label">Telefone</label>
                                <input type="text" class="form-control" id="telefone" name="telefone" th:value="${aluno.telefone}" required>
                                <div class="invalid-feedback">Informe DDD + número com 11 dígitos.</div>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                                <input type="date" class="form-control" id="dataNascimento" name="dataNascimento" 
                                    th:value="${#temporals.format(aluno.dataNascimento, 'yyyy-MM-dd')}">
                            </div>
                            <div class="col-md-6">
                                <label for="dataInicio" class="form-label">Início na Academia</label>
                                <input type="date" class="form-control" id="dataInicio" name="dataInicio"
                                    th:value="${aluno.dataCadastro != null ? #temporals.format(aluno.dataCadastro, 'yyyy-MM-dd') : ''}">
                            </div>
                            
                            <div class="col-md-6">
                                <label for="objetivo" class="form-label">Objetivo</label>
                                <input type="text" class="form-control" id="objetivo" name="objetivo" th:value="${aluno.objetivo}">
                            </div>
                            <div class="col-md-6">
                                        <label for="fotoPerfil" class="form-label">Foto de Perfil</label>
                                        <div class="d-flex align-items-center gap-3">
                                            <img th:if="${aluno.fotoPerfil != null && !#strings.isEmpty(aluno.fotoPerfil)}" 
                                                th:src="@{'/uploads/perfis/' + ${aluno.fotoPerfil}}" 
                                                class="rounded-circle shadow-sm" style="width: 50px; height: 50px; object-fit: cover;">
                                                
                                            <input type="file" class="form-control" id="fotoPerfil" name="file" accept="image/*">
                                        </div>

                                        <div th:if="${instrutor.fotoPerfil != null && !#strings.isEmpty(instrutor.fotoPerfil)}" class="form-check mt-2">
                                            <input class="form-check-input" type="checkbox" name="removerFoto" id="removerFoto" value="true">
                                            <label class="form-check-label text-danger" for="removerFoto">
                                                Remover foto atual
                                            </label>
                                        </div>
                                        <div class="form-text">Formatos: WebP, JPEG ou PNG. Máx: 2 MB.</div>
                                    </div>
                            
                            <div class="mt-2">
                                <a th:href="@{/instrutor/alunos/perfil/{cpf}(cpf=${aluno.cpf})}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                            </div>
                        </form>
                    
                
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        
        $(document).ready(function(){
            // Máscara fixa para 11 dígitos (DDD + 9 dígitos)
            $('#telefone').mask('(00) 00000-0000');

            function validarTelefone(){
                var digits = $('#telefone').val().replace(/\D/g, '');
                var valido = (digits.length === 11);
                $('#telefone').toggleClass('is-invalid', !valido);
                $('form.card button[type="submit"]').prop('disabled', !valido);
            }

            // Valida ao carregar e em mudanças
            validarTelefone();
            $('#telefone').on('input blur', validarTelefone);
            // Não tornar data de início obrigatória; sem validação adicional
            // Validação client-side do arquivo (tipo e tamanho)
            const maxBytes = 2 * 1024 * 1024; // 2 MB
            const tiposPermitidos = ['image/webp','image/jpeg','image/png'];
            const $file = $('#fotoPerfil');
            const $submit = $('form.card button[type="submit"]');
            $file.on('change', function(){
                const f = this.files && this.files[0];
                if (!f) return;
                const okTipo = tiposPermitidos.includes(f.type);
                const okTamanho = f.size <= maxBytes;
                if (!okTipo || !okTamanho) {
                    $file.addClass('is-invalid');
                    const msg = !okTipo ? 'Formato inválido (use WebP/JPEG/PNG).' : 'Arquivo acima de 2 MB.';
                    $file[0].setCustomValidity(msg);
                    $submit.prop('disabled', true);
                } else {
                    $file.removeClass('is-invalid');
                    $file[0].setCustomValidity('');
                    // reabilita apenas se telefone válido também
                    var digits = $('#telefone').val().replace(/\D/g, '');
                    var valido = (digits.length === 11);
                    $submit.prop('disabled', !valido);
                }
            });
        });

        document.addEventListener('DOMContentLoaded', function() {
            const alerts = document.querySelectorAll('.flash-alert');
            alerts.forEach(a => {
                setTimeout(() => {
                    a.classList.add('fade');
                    a.style.opacity = '0';
                    setTimeout(() => a.remove(), 300);
                }, 2000);
            });
        });
    </script>
</body>
</html>
