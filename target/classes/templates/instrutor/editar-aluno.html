<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">🏋️ Academia FatOut - Instrutor</a>
            <div>
                <span class="text-white me-3" th:text="${instrutor.nome}">Carlos Silva</span>
                <a href="/" class="btn btn-light btn-sm">Sair</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-12">
                <a th:href="@{/instrutor/alunos/perfil/{cpf}(cpf=${aluno.cpf})}" class="btn btn-secondary btn-sm">← Voltar</a>
                <h1>Editar Aluno</h1>
                <p class="text-muted" th:text="${aluno.nome}">Nome do Aluno</p>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-8">
                <form th:action="@{/instrutor/alunos/editar/{cpf}(cpf=${aluno.cpf})}" method="post" class="card p-4">
                    
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" name="nome" th:value="${aluno.nome}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" th:value="${aluno.email}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="text" class="form-control" id="telefone" name="telefone" th:value="${aluno.telefone}">
                    </div>
                    
                    <div class="mb-3">
                        <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                        <input type="date" class="form-control" id="dataNascimento" name="dataNascimento" 
                               th:value="${#temporals.format(aluno.dataNascimento, 'yyyy-MM-dd')}">
                    </div>
                    
                    <div class="mb-3">
                        <label for="objetivo" class="form-label">Objetivo</label>
                        <input type="text" class="form-control" id="objetivo" name="objetivo" th:value="${aluno.objetivo}">
                    </div>
                    
                    <div class="mt-4">
                        <a th:href="@{/instrutor/alunos/perfil/{cpf}(cpf=${aluno.cpf})}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-warning">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
