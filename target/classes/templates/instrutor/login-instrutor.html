<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut | Login Instrutor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/login.css}" rel="stylesheet"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    

</head>
<body data-role="instrutor">

    <div class="container">
        <div class="card login-card shadow-lg">
            <div class="card-body p-5">
                
                <div class="text-center mb-4">
                    <h1 class="logo-text">
                        Academia <span>FatOut</span>
                    </h1>
                    <h4 class="fw-bold text-dark mt-3">Login Instrutor</h4>
                    <p class="text-muted small">Acesse seu painel administrativo</p>
                </div>
                
                <form th:action="@{/instrutor/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    
                    <div class="mb-3">
                        <label for="email" class="form-label fw-600 small text-muted">Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;">
                                <i class="bi bi-envelope text-muted"></i>
                            </span>
                            <input type="email" class="form-control border-start-0" id="email" name="email" 
                                   placeholder="seu@email.com" required style="border-radius: 0 12px 12px 0;">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="senha" class="form-label fw-600 small text-muted">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;">
                                <i class="bi bi-lock text-muted"></i>
                            </span>
                            <input type="password" class="form-control border-start-0" id="senha" name="senha" 
                                   placeholder="Digite sua senha" required style="border-radius: 0 12px 12px 0;">
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-login">
                            Entrar
                        </button>
                        <a th:href="@{/}" class="btn btn-link btn-voltar-login text-decoration-none text-muted small">
                            Voltar
                        </a>
                    </div>
                    
                    <div th:if="${error}" class="alert alert-danger mt-3 py-2 small border-0" style="border-radius: 10px;">
                        <i class="bi bi-exclamation-circle me-1"></i> <span th:text="${error}">Erro no login</span>
                    </div>

                    <div class="mt-4 test-credentials">
                        <h6 class="text-uppercase fw-bold text-center" style="font-size: 0.65rem; color: #94a3b8; letter-spacing: 1px;">Credenciais de Teste</h6>
                        <div class="text-center mt-2" style="font-size: 0.8rem;">
                            <div class="text-muted"><strong>Email:</strong> carlos@academia.com</div>
                            <div class="text-muted"><strong>Senha:</strong> 123</div>
                        </div>
                    </div>
                    
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
