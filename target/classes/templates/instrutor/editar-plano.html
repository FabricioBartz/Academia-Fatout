<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
        <meta charset="UTF-8">
        <title>Academia FatOut</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link th:href="@{/css/style.css}" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta http-equiv="Cache-Control" content="no-store" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <base target="_self">
        <script>
            // Mantém o padrão de abrir em nova aba quando vindo da lista
            // (o link já usa target _blank na origem)
        </script>
        <style>
            /* Ajustes visuais consistentes */
            .exercicio-item + .exercicio-item { margin-top: 1rem; }
        </style>
        <title>Academia FatOut</title>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="#">🏋️ Academia FatOut</a>
                <div class="navbar-text text-white">
                    Instrutor: <span th:text="${instrutor.nome}">Carlos Silva</span>
                    <a href="/" class="btn btn-outline-dark btn-sm ms-3">Sair</a>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Menu</h5>
                        <div class="list-group list-group-flush">
                                <a th:href="@{/instrutor/painel_principal}" class="list-group-item list-group-item-action">
                                  Painel Principal
                            </a>
                            <a th:href="@{/instrutor/meus_alunos}" class="list-group-item list-group-item-action active">
                                👥 Meus Alunos
                            </a>
                            <a th:href="@{/instrutor/minhas_turmas}" class="list-group-item list-group-item-action">
                                🏋️ Minhas Turmas
                            </a>
                            <a th:href="@{/instrutor/exercicios}" class="list-group-item list-group-item-action">
                                💪 Exercícios
                            </a>
                            <a th:if="${instrutor.admin}" th:href="@{/instrutor/instrutores}" class="list-group-item list-group-item-action">
                                🧑‍🏫 Instrutores
                            </a>
                        </div>
                    </div>
                </div>
            </div>
                <div class="col-md-9">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <div class="d-flex align-items-center">
                            <a th:href="@{/instrutor/alunos/perfil/{cpf}(cpf=${aluno.cpf})}" class="btn btn-secondary btn-sm me-3">← Voltar</a>
                            <h1 class="mb-0">Editar Plano de Treino</h1>
                            <span class="text-muted ms-3" th:text="${aluno.nome}">João Silva</span>
                        </div>
                        <div class="ms-3 flash-slot">
                            <div th:if="${msgSucesso}" class="alert alert-success flash-alert mb-0" th:text="${msgSucesso}">Sucesso</div>
                            <div th:if="${msgErro}" class="alert alert-danger flash-alert mb-0" th:text="${msgErro}">Erro</div>
                        </div>
                    </div>

                    <form th:action="@{'/instrutor/alunos/planos/' + ${aluno.cpf} + '/' + ${plano.id} + '/editar'}" method="post" class="card p-3">
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <div class="mb-3">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            
                            
                            <label class="form-label">Nome do Treino</label>
                            <input type="text" class="form-control" name="nome" th:value="${plano.nome}" placeholder="Ex: Treino A - Peito e Tríceps" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Dias da Semana</label>
                            <div class="d-flex flex-wrap gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="diasSemana" value="SEG" id="diaSEG" th:checked="${plano.diasSemana != null and #strings.contains(plano.diasSemana, 'SEG')}">
                                    <label class="form-check-label" for="diaSEG">Seg</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="diasSemana" value="TER" id="diaTER" th:checked="${plano.diasSemana != null and #strings.contains(plano.diasSemana, 'TER')}">
                                    <label class="form-check-label" for="diaTER">Ter</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="diasSemana" value="QUA" id="diaQUA" th:checked="${plano.diasSemana != null and #strings.contains(plano.diasSemana, 'QUA')}">
                                    <label class="form-check-label" for="diaQUA">Qua</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="diasSemana" value="QUI" id="diaQUI" th:checked="${plano.diasSemana != null and #strings.contains(plano.diasSemana, 'QUI')}">
                                    <label class="form-check-label" for="diaQUI">Qui</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="diasSemana" value="SEX" id="diaSEX" th:checked="${plano.diasSemana != null and #strings.contains(plano.diasSemana, 'SEX')}">
                                    <label class="form-check-label" for="diaSEX">Sex</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="diasSemana" value="SAB" id="diaSAB" th:checked="${plano.diasSemana != null and #strings.contains(plano.diasSemana, 'SAB')}">
                                    <label class="form-check-label" for="diaSAB">Sáb</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="diasSemana" value="DOM" id="diaDOM" th:checked="${plano.diasSemana != null and #strings.contains(plano.diasSemana, 'DOM')}">
                                    <label class="form-check-label" for="diaDOM">Dom</label>
                                </div>
                            </div>
                            <div class="form-text">Selecione os dias em que este treino deve ser realizado.</div>
                        </div>

                        <h6 class="mb-2">Exercícios</h6>
                        <div id="exercicios-list">
                            <!-- Renderização dos exercícios existentes -->
                            <div class="card mb-3 exercicio-item" th:each="item,idx : ${(plano.exercicios != null) ? plano.exercicios : #lists.emptyList()}">
                                <div class="card-body">
                                    <div class="row g-2 align-items-end">
                                        <div class="col-md-6">
                                            <label class="form-label">Exercício</label>
                                            <select class="form-select" name="exercicioId" required>
                                                <option value="" disabled th:selected="${item.exercicio == null}">Selecione o exercício</option>
                                                <option th:each="ex : ${exercicios}" th:value="${ex.id}" th:selected="${item.exercicio != null and ex.id == item.exercicio.id}" th:text="${ex.nome}"></option>
                                            </select>
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">Séries</label>
                                            <input type="number" class="form-control" name="series" placeholder="Ex: 3" min="1" th:value="${item.series}" required>
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">Repetições</label>
                                            <input type="number" class="form-control" name="repeticoes" placeholder="Ex: 12" min="1" th:value="${item.repeticoes}" required>
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">Carga (kg)</label>
                                            <input type="number" step="0.1" class="form-control" name="carga" th:value="${item.carga}" placeholder="Ex: 20">
                                        </div>
                                        <div class="col-12 d-flex justify-content-end mt-2">
                                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="removerExercicio(this)">Excluir exercício</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Caso não haja exercícios, mostrar um bloco vazio -->
                            <div class="card mb-3 exercicio-item" th:if="${plano.exercicios == null or #lists.isEmpty(plano.exercicios)}">
                                <div class="card-body">
                                    <div class="row g-2 align-items-end">
                                        <div class="col-md-6">
                                            <label class="form-label">Exercício</label>
                                            <select class="form-select" name="exercicioId" required>
                                                <option value="" selected disabled>Selecione o exercício</option>
                                                <option th:each="ex : ${exercicios}" th:value="${ex.id}" th:text="${ex.nome}"></option>
                                            </select>
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">Séries</label>
                                            <input type="number" class="form-control" name="series" placeholder="Ex: 3" min="1" required>
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">Repetições</label>
                                            <input type="number" class="form-control" name="repeticoes" placeholder="Ex: 12" min="1" required>
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">Carga (kg)</label>
                                            <input type="number" step="0.1" class="form-control" name="carga" placeholder="Ex: 20">
                                        </div>
                                        <div class="col-12 d-flex justify-content-end mt-2">
                                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="removerExercicio(this)">Excluir exercício</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <button type="button" class="btn btn-outline-secondary" onclick="adicionarExercicio()">+ Adicionar Exercício</button>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Observações (opcional)</label>
                            <textarea class="form-control" name="observacoes" id="observacoes" rows="3" th:text="${plano.observacoes}" placeholder="Ex: Descanso 60s entre séries"></textarea>
                        </div>

                        <div>
                            <a th:href="@{/instrutor/alunos/perfil/{cpf}(cpf=${aluno.cpf})}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">Salvar Treino</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            // Auto-dismiss flash
            document.addEventListener('DOMContentLoaded', function() {
                const alerts = document.querySelectorAll('.flash-alert');
                alerts.forEach(a => {
                    setTimeout(() => {
                        a.classList.add('fade');
                        a.style.opacity = '0';
                        setTimeout(() => a.remove(), 300);
                    }, 2000);
                });
            });
            function adicionarExercicio() {
                const lista = document.getElementById('exercicios-list');
                const items = lista.getElementsByClassName('exercicio-item');
                if (!items.length) return;
                const clone = items[0].cloneNode(true);
                Array.from(clone.querySelectorAll('select, input')).forEach(el => {
                    if (el.tagName === 'SELECT') {
                        el.selectedIndex = 0;
                    } else {
                        el.value = '';
                    }
                });
                lista.appendChild(clone);
            }

            function removerExercicio(button) {
                const lista = document.getElementById('exercicios-list');
                const items = lista.getElementsByClassName('exercicio-item');
                if (items.length <= 1) {
                    alert('Pelo menos um exercício é obrigatório.');
                    return;
                }
                const card = button.closest('.exercicio-item');
                if (card) card.remove();
            }
        </script>
    </body>
</html>
