<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body data-role="instrutor">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Academia FatOut</a>
            <div class="navbar-text text-white">
                Instrutor: <span th:text="${instrutor.nome}">Carlos Silva</span>
                <a href="/" class="btn btn-outline-dark btn-sm ms-3">Sair</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
     <div class="row">
            <!-- Menu -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Menu</h5>
                        <div class="list-group list-group-flush">
                            <a th:href="@{/instrutor/painel_principal}" class="list-group-item list-group-item-action">Painel Principal</a>
                            <a th:href="@{/instrutor/meus_alunos}" class="list-group-item list-group-item-action active"><i class="bi bi-people-fill"></i> Meus Alunos</a>
                            <a th:href="@{/instrutor/minhas_turmas}" class="list-group-item list-group-item-action"><i class="bi bi-person-lines-fill"></i> Minhas Turmas</a>
                            <a th:href="@{/instrutor/exercicios}" class="list-group-item list-group-item-action"><i class="bi bi-activity"></i> Exercícios</a>
                            <a th:if="${instrutor.admin}" th:href="@{/instrutor/instrutores}" class="list-group-item list-group-item-action"><i class="bi bi-person-badge-fill"></i> Instrutores</a>
                        </div>
                    </div>
                </div>
            </div>
           
            <div class="col-md-9">
                <div class="d-flex align-items-center justify-content-between mb-4" style="height: 45px;">
                    <div class="d-flex align-items-center">
                        <a th:href="@{/instrutor/alunos}" class="btn btn-secondary btn-sm me-3 btn-voltar-google">
                            <span class="material-symbols-outlined">arrow_back</span>
                            <span></span>
                        </a>
                        <h1 class="mb-0">Avaliação Física</h1>
                        <span class="text-muted ms-3" th:text="${aluno.nome}">João Silva</span>
                    </div>
                    <div class="ms-3 flash-slot">
                        <div th:if="${msgSucesso}" class="alert alert-success flash-alert mb-0" th:text="${msgSucesso}">Sucesso</div>
                        <div th:if="${msgErro}" class="alert alert-danger flash-alert mb-0" th:text="${msgErro}">Erro</div>
                    </div>
                </div>
                                <!-- Form na mesma coluna para eliminar qualquer gap entre título e conteúdo -->
                                <form th:action="${avaliacao} != null ? @{/instrutor/alunos/avaliacoes/{cpf}/{id}/editar(cpf=${aluno.cpf},id=${avaliacao.id})} : @{/instrutor/alunos/avaliacao/{cpf}(cpf=${aluno.cpf})}"
                                            method="post" class="card p-3 mt-0">
                                        <h5 class="mb-2 mt-0" th:text="${avaliacao} != null ? 'Editar Avaliação Física' : 'Nova Avaliação Física'">Nova Avaliação Física</h5>
                    <div th:if="${error}" class="alert alert-danger mb-2" th:text="${error}"></div>

                    <!-- Dados Básicos -->
                    <h6 class="mb-2 mt-2">Dados Básicos</h6>
                    <div class="row mb-2">
                        <div class="col-md-4">
                            <label for="peso" class="form-label">Peso (kg)</label>
                            <input type="number" step="0.01" class="form-control" id="peso" name="peso" placeholder="Ex: 75.5" th:value="${avaliacao != null} ? ${avaliacao.peso} : ''" required>
                        </div>
                        <div class="col-md-4">
                            <label for="altura" class="form-label">Altura (m)</label>
                            <input type="number" step="0.01" class="form-control" id="altura" name="altura" placeholder="Ex: 1.75" th:value="${avaliacao != null} ? ${avaliacao.altura} : ''" required>
                        </div>
                        <div class="col-md-4">
                            <label for="imc" class="form-label">IMC</label>
                            <input type="text" class="form-control" id="imc" placeholder="-" th:value="${avaliacao != null} ? ${#numbers.formatDecimal(avaliacao.imc, 1, 2)} : ''" disabled>
                        </div>
                    </div>

                    <!-- Medidas Corporais -->
                    <h6 class="mb-2 mt-2">Medidas Corporais (cm)</h6>
                    <div class="row mb-2">
                        <div class="col-md-4">
                            <label for="peito" class="form-label">Peito</label>
                            <input type="number" step="0.01" class="form-control" id="peito" name="peito" placeholder="Ex: 100" th:value="${avaliacao != null} ? ${avaliacao.peito} : ''" required>
                        </div>
                        <div class="col-md-4">
                            <label for="cintura" class="form-label">Cintura</label>
                            <input type="number" step="0.01" class="form-control" id="cintura" name="cintura" placeholder="Ex: 85" th:value="${avaliacao != null} ? ${avaliacao.cintura} : ''" required>
                        </div>
                        <div class="col-md-4">
                            <label for="quadril" class="form-label">Quadril</label>
                            <input type="number" step="0.01" class="form-control" id="quadril" name="quadril" placeholder="Ex: 95" th:value="${avaliacao != null} ? ${avaliacao.quadril} : ''" required>
                        </div>
                    </div>

                    <!-- Braços -->
                    <h6 class="mb-2 mt-2">Braços (cm)</h6>
                    <div class="row mb-2">
                        <div class="col-md-6">
                            <label for="bicepsEsquerdo" class="form-label">Bíceps Esquerdo</label>
                            <input type="number" step="0.01" class="form-control" id="bicepsEsquerdo" name="bicepsEsquerdo" placeholder="Ex: 35" th:value="${avaliacao != null} ? ${avaliacao.bicepsEsquerdo} : ''" required>
                        </div>
                        <div class="col-md-6">
                            <label for="bicepsDireito" class="form-label">Bíceps Direito</label>
                            <input type="number" step="0.01" class="form-control" id="bicepsDireito" name="bicepsDireito" placeholder="Ex: 36" th:value="${avaliacao != null} ? ${avaliacao.bicepsDireito} : ''" required>
                        </div>
                    </div>

                    <!-- Coxas -->
                    <h6 class="mb-2 mt-2">Coxas (cm)</h6>
                    <div class="row mb-2">
                        <div class="col-md-6">
                            <label for="coxaEsquerda" class="form-label">Coxa Esquerda</label>
                            <input type="number" step="0.01" class="form-control" id="coxaEsquerda" name="coxaEsquerda" placeholder="Ex: 58" th:value="${avaliacao != null} ? ${avaliacao.coxaEsquerda} : ''" required>
                        </div>
                        <div class="col-md-6">
                            <label for="coxaDireita" class="form-label">Coxa Direita</label>
                            <input type="number" step="0.01" class="form-control" id="coxaDireita" name="coxaDireita" placeholder="Ex: 58" th:value="${avaliacao != null} ? ${avaliacao.coxaDireita} : ''" required>
                        </div>
                    </div>

                    <!-- Panturrilhas -->
                    <h6 class="mb-2 mt-2">Panturrilhas (cm)</h6>
                    <div class="row mb-2">
                        <div class="col-md-6">
                            <label for="panturrilhaEsquerda" class="form-label">Panturrilha Esquerda</label>
                            <input type="number" step="0.01" class="form-control" id="panturrilhaEsquerda" name="panturrilhaEsquerda" placeholder="Ex: 38" th:value="${avaliacao != null} ? ${avaliacao.panturrilhaEsquerda} : ''">
                        </div>
                        <div class="col-md-6">
                            <label for="panturrilhaDireita" class="form-label">Panturrilha Direita</label>
                            <input type="number" step="0.01" class="form-control" id="panturrilhaDireita" name="panturrilhaDireita" placeholder="Ex: 38" th:value="${avaliacao != null} ? ${avaliacao.panturrilhaDireita} : ''">
                        </div>
                    </div>

                    <!-- Observações -->
                    <h6 class="mb-2 mt-2">Observações</h6>
                    <div class="mb-2">
                        <textarea class="form-control" id="observacoes" name="observacoes" rows="4" placeholder="Digite observações sobre a avaliação, objetivos do aluno, etc." th:text="${avaliacao != null} ? ${avaliacao.observacoes} : ''"></textarea>
                    </div>

                    <!-- Botões -->
                    <div class="mt-2">
                        <a th:href="@{/instrutor/alunos/perfil/{cpf}(cpf=${aluno.cpf})}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary" th:text="${avaliacao} != null ? 'Salvar Alterações' : 'Salvar Avaliação'">Salvar Avaliação</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-dismiss flash
        document.addEventListener('DOMContentLoaded', function() {
            const alerts = document.querySelectorAll('.flash-alert');
            alerts.forEach(a => {
                setTimeout(() => {
                    a.classList.add('fade');
                    a.style.opacity = '0';
                    setTimeout(() => a.remove(), 300);
                }, 2000);
            });
        });
        // Calcular IMC automaticamente
        document.getElementById('peso').addEventListener('change', calcularImc);
        document.getElementById('altura').addEventListener('change', calcularImc);
        
        function calcularImc() {
            const peso = parseFloat(document.getElementById('peso').value);
            const altura = parseFloat(document.getElementById('altura').value);
            
            if (peso > 0 && altura > 0) {
                const imc = (peso / (altura * altura)).toFixed(2);
                document.getElementById('imc').value = imc;
            }
        }
    </script>
</body>
</html>
