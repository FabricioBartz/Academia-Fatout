<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center p-5">
                        <h1 class="card-title text-primary mb-4">🏋️ Academia FatOut</h1>
                        <h3 class="mb-4">Selecione o tipo de acesso</h3>
                        
                        <div class="d-grid gap-3">
                            <a th:href="@{/instrutor/login}" class="btn btn-primary btn-lg">
                                <h5>👨‍🏫 Sou Instrutor</h5>
                                <small>Acesso para professores</small>
                            </a>
                            
                            <a th:href="@{/aluno/login}" class="btn btn-success btn-lg">
                                <h5>👤 Sou Aluno</h5>
                                <small>Acesso para alunos</small>
                            </a>
                        </div>
                        
                        <div class="mt-4 text-muted">
                            <small>Credenciais de teste:</small><br>
                            <small>Aluno: joao@email.com / 123</small><br>
                            <small>Instrutor: carlos@academia.com / 123</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
