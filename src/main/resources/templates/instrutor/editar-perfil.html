<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Academia FatOut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800&display=swap" rel="stylesheet">
</head>
<body data-role="instrutor">
<!--Cabeçalho-->
   <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand logo-text mb-0" th:href="@{/instrutor/painel_principal}" style="font-size: 24px;">Academia <span>FatOut</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPerfil"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse justify-content-end" id="navPerfil">
            <div class="d-flex align-items-center profile-section">
                <div class="text-end me-3 d-none d-sm-block">
                    <small class="d-block text-white-50">Bem-vindo,</small>
                    <strong class="text-white" th:text="${instrutor.nome}">Carlos Silva</strong>
                </div>
                <div class="profile-nav-wrapper">
                    <img th:if="${instrutor.fotoPerfil != null}" 
                         th:src="@{'/uploads/perfis/' + ${instrutor.fotoPerfil}}" 
                         class="nav-avatar-modern">
                    <i th:unless="${instrutor.fotoPerfil != null}" 
                       class="bi bi-person-circle nav-avatar-icon-modern"></i>
                </div>

                <a href="/" class="btn-sair-modern ms-3">
                    <i class="bi bi-box-arrow-right"></i>
                </a>
            </div>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="row">
            <!-- Menu lateral -->
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">Menu</h5>
                        <div class="list-group list-group-flush">
                            <a th:href="@{/instrutor/painel_principal}" class="list-group-item list-group-item-action">Painel Principal</a>
                            <a th:href="@{/instrutor/meu_perfil}" class="list-group-item list-group-item-action"><i class="bi bi-person-circle"></i> Meu Perfil</a>
                            <a th:href="@{/instrutor/meus_alunos}" class="list-group-item list-group-item-action"><i class="bi bi-people-fill"></i> Meus Alunos</a>
                            <a th:href="@{/instrutor/minhas_turmas}" class="list-group-item list-group-item-action"><i class="bi bi-person-lines-fill"></i> Minhas Turmas</a>
                            <a th:href="@{/instrutor/exercicios}" class="list-group-item list-group-item-action"><i class="bi bi-activity"></i> Exercícios</a>
                            <a th:if="${instrutor.admin}" th:href="@{/instrutor/instrutores}" class="list-group-item list-group-item-action"><i class="bi bi-person-badge-fill"></i> Instrutores</a>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Conteúdo principal -->
            <div class="col-md-9">
                <div class="d-flex align-items-center justify-content-between mb-4" style="height: 45px;">
                    <div class="d-flex align-items-center">
                        <a th:href="@{/instrutor/meu_perfil}" class="btn btn-secondary btn-sm me-3 btn-voltar-google">
                            <span class="material-symbols-outlined">arrow_back</span>
                        </a>
                        <h1 class="mb-0 fw-bold">Editar Perfil</h1>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{/instrutor/editar-perfil}" method="post" enctype="multipart/form-data">
                                                        <input type="hidden" name="cpf" th:value="${instrutor.cpf}" />
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="nome" class="form-label">Nome</label>
                                    <input type="text" class="form-control" id="nome" name="nome" th:value="${instrutor.nome}" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">E-mail</label>
                                    <input type="email" class="form-control" id="email" name="email" th:value="${instrutor.email}" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="telefone" class="form-label">Telefone</label>
                                    <input type="text" class="form-control" id="telefone" name="telefone" th:value="${instrutor.telefone}">
                                    <div class="invalid-feedback">Informe DDD + número com 11 dígitos.</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="dataCadastro" class="form-label">Início na Academia</label>
                                    <input type="date" class="form-control" id="dataCadastro" th:value="${instrutor.dataCadastro != null ? #temporals.format(instrutor.dataCadastro, 'yyyy-MM-dd') : ''}" name="dataCadastro">
                                </div>
                                <div class="col-md-6">
                                    <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                                    <input type="date" class="form-control" id="dataNascimento" th:value="${instrutor.dataNascimento != null ? #temporals.format(instrutor.dataNascimento, 'yyyy-MM-dd') : ''}" name="dataNascimento">
                                
                                    <div class="mt-3"> 
                                    <input class="form-check-input" type="checkbox" id="admin" name="admin" th:checked="${instrutor.admin}" value="true">
                                    <label class="form-check-label" for="admin">Administrador</label>
                                    </div>
                                    
                                </div>
                            <div class="col-md-6">
                                <label for="fotoPerfil" class="form-label">Foto de Perfil</label>
                                <div class="d-flex align-items-center gap-3">
                                    <img th:if="${instrutor.fotoPerfil != null && !#strings.isEmpty(instrutor.fotoPerfil)}" 
                                        th:src="@{'/uploads/perfis/' + ${instrutor.fotoPerfil}}" 
                                        class="rounded-circle shadow-sm" style="width: 50px; height: 50px; object-fit: cover;">
                                        
                                    <input type="file" class="form-control" id="fotoPerfil" name="file" accept="image/*">
                                </div>

                                <div th:if="${instrutor.fotoPerfil != null && !#strings.isEmpty(instrutor.fotoPerfil)}" class="form-check mt-2">
                                    <input class="form-check-input" type="checkbox" name="removerFoto" id="removerFoto" value="true">
                                    <label class="form-check-label text-danger" for="removerFoto">
                                        Remover foto atual
                                    </label>
                                </div>
                                <div class="form-text">Formatos: WebP, JPEG ou PNG. Máx: 2 MB.</div>
                            </div>
                            </div>
                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a th:href="@{/instrutor/meu_perfil}" class="btn btn-warning">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script>
        $(document).ready(function(){
            // Aplica a máscara visual: (51) 99999-9999
            $('#telefone').mask('(00) 00000-0000');
        });
        
</script>
</body>
</html>
