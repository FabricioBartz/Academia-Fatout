<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut | Login Instrutor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Gradiente de fundo unificado com a tela anterior */
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .login-card {
            border: none;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            max-width: 420px;
            margin: 0 auto;
        }

        /* Logo Estilizado igual à tela de seleção */
        .logo-text {
            font-family: 'Exo 2', sans-serif;
            font-size: 28px;
            font-weight: 800;
            font-style: italic;
            color: #1e293b;
            letter-spacing: 0px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 0.5rem;
        }

        .logo-text span {
            color: #0d6efd;
            text-shadow: 2px 2px 4px rgba(13, 110, 253, 0.2);
        }

        .form-control {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 1px solid #dee2e6;
            background-color: #f8f9fa;
        }

        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
            border-color: #0d6efd;
        }

        /* Botão principal com o efeito de saltar */
        .btn-login {
            border-radius: 15px;
            padding: 0.8rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background-color: #0d6efd;
            border: none;
        }

        .btn-login:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(13, 110, 253, 0.3);
        }

        .test-credentials {
            background: rgba(0,0,0,0.03);
            border-radius: 12px;
            padding: 15px;
        }

        .btn-voltar {
            border-radius: 15px;
            padding: 0.8rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background-color: #f1f3f4;
            color: #3c4043 !important;            
            border: 1px solid #dadce0 !important;
        }

        .btn-voltar:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 15px rgba(13, 110, 253, 0.3);
        }
        
    </style>
</head>
<body data-role="instrutor">

    <div class="container">
        <div class="card login-card shadow-lg">
            <div class="card-body p-5">
                
                <div class="text-center mb-4">
                    <h1 class="logo-text">
                        Academia <span>FatOut</span>
                    </h1>
                    <h4 class="fw-bold text-dark mt-3">Login Instrutor</h4>
                    <p class="text-muted small">Acesse seu painel administrativo</p>
                </div>
                
                <form th:action="@{/instrutor/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    
                    <div class="mb-3">
                        <label for="email" class="form-label fw-600 small text-muted">Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;">
                                <i class="bi bi-envelope text-muted"></i>
                            </span>
                            <input type="email" class="form-control border-start-0" id="email" name="email" 
                                   placeholder="seu@email.com" required style="border-radius: 0 12px 12px 0;">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="senha" class="form-label fw-600 small text-muted">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px;">
                                <i class="bi bi-lock text-muted"></i>
                            </span>
                            <input type="password" class="form-control border-start-0" id="senha" name="senha" 
                                   placeholder="Digite sua senha" required style="border-radius: 0 12px 12px 0;">
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-login">
                            Entrar
                        </button>
                        <a th:href="@{/}" class="btn btn-link btn-voltar text-decoration-none text-muted small">
                            Voltar
                        </a>
                    </div>
                    
                    <div th:if="${error}" class="alert alert-danger mt-3 py-2 small border-0" style="border-radius: 10px;">
                        <i class="bi bi-exclamation-circle me-1"></i> <span th:text="${error}">Erro no login</span>
                    </div>

                    <div class="mt-4 test-credentials">
                        <h6 class="text-uppercase fw-bold text-center" style="font-size: 0.65rem; color: #94a3b8; letter-spacing: 1px;">Credenciais de Teste</h6>
                        <div class="text-center mt-2" style="font-size: 0.8rem;">
                            <div class="text-muted"><strong>Email:</strong> carlos@academia.com</div>
                            <div class="text-muted"><strong>Senha:</strong> 123</div>
                        </div>
                    </div>
                    
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
