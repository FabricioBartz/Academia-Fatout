<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Alunos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">🏋️ Academia FatOut - Instrutor</a>
            <div>
                <span class="text-white me-3" th:text="${instrutor.nome}">Carlos Silva</span>
                <a href="/" class="btn btn-light btn-sm">Sair</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="list-group">
                    <a th:href="@{/instrutor/dashboard}" class="list-group-item list-group-item-action">Dashboard</a>
                    <a th:href="@{/instrutor/alunos}" class="list-group-item list-group-item-action active">Gerenciar Alunos</a>
                    <a th:href="@{/instrutor/turmas}" class="list-group-item list-group-item-action">Gerenciar Turmas</a>
                    <a th:href="@{/instrutor/exercicios}" class="list-group-item list-group-item-action">Gerenciar Exercícios</a>
                </div>
            </div>
            
            <div class="col-md-9">
                <h1>Gerenciar Alunos</h1>
                <p>Cadastrar e gerenciar alunos da academia.</p>
                <button class="btn btn-primary mb-3">Cadastrar Novo Aluno</button>
                <div class="alert alert-info">
                    Funcionalidade em desenvolvimento.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
