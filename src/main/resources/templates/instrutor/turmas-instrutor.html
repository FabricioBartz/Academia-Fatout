<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Turmas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">🏋️ Academia FatOut - Instrutor</a>
            <div>
                <span class="text-white me-3" th:text="${instrutor.nome}">Carlos Silva</span>
                <a href="/" class="btn btn-light btn-sm">Sair</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="list-group">
                    <a th:href="@{/instrutor/dashboard}" class="list-group-item list-group-item-action">Dashboard</a>
                    <a th:href="@{/instrutor/alunos}" class="list-group-item list-group-item-action">Gerenciar Alunos</a>
                    <a th:href="@{/instrutor/turmas}" class="list-group-item list-group-item-action active">Gerenciar Turmas</a>
                    <a th:href="@{/instrutor/exercicios}" class="list-group-item list-group-item-action">Gerenciar Exercícios</a>
                </div>
            </div>
            
            <div class="col-md-9">
                <h1>Gerenciar Turmas</h1>
                <p>Criar e gerenciar turmas de aulas.</p>
                
                <!-- Botão para abrir modal -->
                <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#criarTurmaModal">Criar Nova Turma</button>
                
                <!-- Modal para criar turma -->
                <div class="modal fade" id="criarTurmaModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Criar Nova Turma</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <form th:action="@{/instrutor/turmas/criar}" method="post">
                                <div class="modal-body">
                                    <div class="mb-3">
                                        <label for="titulo" class="form-label">Título</label>
                                        <input type="text" class="form-control" id="titulo" name="titulo" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="descricao" class="form-label">Descrição</label>
                                        <textarea class="form-control" id="descricao" name="descricao" rows="3"></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label for="dataDaAula" class="form-label">Data da Aula</label>
                                        <input type="date" class="form-control" id="dataDaAula" name="dataDaAula" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="horaAula" class="form-label">Hora da Aula</label>
                                        <input type="time" class="form-control" id="horaAula" name="horaAula" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="vagas" class="form-label">Número de Vagas</label>
                                        <input type="number" class="form-control" id="vagas" name="vagas" min="1" required>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    <button type="submit" class="btn btn-primary">Criar Turma</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                
                <!-- Modal para editar turma -->
                <div class="modal fade" id="editarTurmaModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Editar Turma</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <form th:action="@{/instrutor/turmas/editar}" method="post">
                                <input type="hidden" id="editId" name="id">
                                <div class="modal-body">
                                    <div class="mb-3">
                                        <label for="editTitulo" class="form-label">Título</label>
                                        <input type="text" class="form-control" id="editTitulo" name="titulo" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="editDescricao" class="form-label">Descrição</label>
                                        <textarea class="form-control" id="editDescricao" name="descricao" rows="3"></textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label for="editDataDaAula" class="form-label">Data da Aula</label>
                                        <input type="date" class="form-control" id="editDataDaAula" name="dataDaAula" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="editHoraAula" class="form-label">Hora da Aula</label>
                                        <input type="time" class="form-control" id="editHoraAula" name="horaAula" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="editVagas" class="form-label">Número de Vagas</label>
                                        <input type="number" class="form-control" id="editVagas" name="vagas" min="1" required>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                
              <!--  <div class="alert alert-info">
                    Funcionalidade implementada. Use o botão acima para criar turmas.
                </div>-->
                
                <!-- Lista de Turmas -->
                <h3>Turmas Criadas</h3>
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Título</th>
                                <th>Data</th>
                                <th>Hora</th>
                                <th>Vagas</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="turma : ${turmas}">
                                <td th:text="${turma.titulo}">Título da Turma</td>
                                <td th:text="${#temporals.format(turma.dataDaAula, 'dd/MM/yyyy')}">01/01/2024</td>
                                <td th:text="${#temporals.format(turma.horaAula, 'HH:mm')}">10:00</td>
                                <td th:text="${turma.vagas}">20</td>
                                <td>
                                    <button class="btn btn-sm btn-warning" onclick="editarTurma(this)" th:data-id="${turma.id}" th:data-titulo="${turma.titulo}" th:data-descricao="${turma.descricao}" th:data-data="${#temporals.format(turma.dataDaAula, 'yyyy-MM-dd')}" th:data-hora="${#temporals.format(turma.horaAula, 'HH:mm')}" th:data-vagas="${turma.vagas}">Editar</button>
                                    <form method="post" th:action="@{/instrutor/turmas/excluir/{id}(id=${turma.id})}" style="display:inline;" onsubmit="return confirm('Tem certeza que deseja excluir esta turma?')">
                                        <button type="submit" class="btn btn-sm btn-danger">Excluir</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function editarTurma(button) {
            const id = button.getAttribute('data-id');
            const titulo = button.getAttribute('data-titulo');
            const descricao = button.getAttribute('data-descricao');
            const data = button.getAttribute('data-data');
            const hora = button.getAttribute('data-hora');
            const vagas = button.getAttribute('data-vagas');
            
            document.getElementById('editId').value = id;
            document.getElementById('editTitulo').value = titulo;
            document.getElementById('editDescricao').value = descricao;
            document.getElementById('editDataDaAula').value = data;
            document.getElementById('editHoraAula').value = hora;
            document.getElementById('editVagas').value = vagas;
            
            const modal = new bootstrap.Modal(document.getElementById('editarTurmaModal'));
            modal.show();
        }
    </script>
</body>
</html>
