<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Academia FatOut | Acesso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/login.css}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card login-card shadow-lg">
                    <div class="card-body text-center p-5">
                        
                        
                        <h2 class="mb-2" style="font-family: 'Exo 2', sans-serif; font-size: 35px; font-weight: 800; font-style: italic; color: #1e293b; letter-spacing: 0px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">
                            Academia <span style="color: #0d6efd; text-shadow: 2px 2px 4px rgba(13, 110, 253, 0.2);">FatOut</span>
                        </h2>
                        <p></p>
                        <p class="text-muted mb-4">Escolha seu portal de entrada</p>
                        
                        <div class="d-grid gap-3">
                            <a th:href="@{/instrutor/login}" class="btn-access btn-instrutor text-white">
                                <div class="d-flex align-items-center justify-content-center">
                                    <i class="bi bi-person-badge fs-2 me-3"></i>
                                    <div class="text-start">
                                        <h5 class="mb-0">Sou Instrutor</h5>
                                        <small>Painel do Professor</small>
                                    </div>
                                </div>
                            </a>
                            
                            <a th:href="@{/aluno/login}" class="btn-access btn-aluno text-white">
                                <div class="d-flex align-items-center justify-content-center">
                                    <i class="bi bi-person-arms-up fs-2 me-3"></i>
                                
                                    <div class="text-start">
                                        <h5 class="mb-0">Sou Aluno</h5>
                                        <small>Minha Área de Treino</small>
                                    </div>
                                </div>
                            </a>
                        </div>
                        
                       

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
