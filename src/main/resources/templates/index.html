<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut | Acesso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@1,800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .login-card {
            border: none;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }

        .logo-icon {
            font-size: 3.5rem;
            background: linear-gradient(45deg, #0d6efd, #0dcaf0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        /* Efeito de saltar para frente nos botões */
        .btn-access {
            border-radius: 18px;
            padding: 1.2rem;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: none;
            text-decoration: none;
            display: block;
        }

        .btn-access:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
            color: white;
        }

        .btn-instrutor {
            background-color: #0d6efd;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.2);
        }

        .btn-aluno {
            background-color: #198754;
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.2);
        }

        .btn-access h5 {
            margin-bottom: 2px;
            font-weight: 700;
        }

        .btn-access small {
            opacity: 0.85;
            font-weight: 400;
        }

        .test-credentials {
            background: rgba(0,0,0,0.03);
            border-radius: 12px;
            padding: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card login-card shadow-lg">
                    <div class="card-body text-center p-5">
                        
                        
                        <h2 class="mb-2" style="font-family: 'Exo 2', sans-serif; font-size: 35px; font-weight: 800; font-style: italic; color: #1e293b; letter-spacing: 0px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">
                            Academia <span style="color: #0d6efd; text-shadow: 2px 2px 4px rgba(13, 110, 253, 0.2);">FatOut</span>
                        </h2>
                        <p></p>
                        <p class="text-muted mb-4">Escolha seu portal de entrada</p>
                        
                        <div class="d-grid gap-3">
                            <a th:href="@{/instrutor/login}" class="btn-access btn-instrutor text-white">
                                <div class="d-flex align-items-center justify-content-center">
                                    <i class="bi bi-person-badge fs-2 me-3"></i>
                                    <div class="text-start">
                                        <h5 class="mb-0">Sou Instrutor</h5>
                                        <small>Painel do Professor</small>
                                    </div>
                                </div>
                            </a>
                            
                            <a th:href="@{/aluno/login}" class="btn-access btn-aluno text-white">
                                <div class="d-flex align-items-center justify-content-center">
                                    <i class="bi bi-person-arms-up fs-2 me-3"></i>
                                
                                    <div class="text-start">
                                        <h5 class="mb-0">Sou Aluno</h5>
                                        <small>Minha Área de Treino</small>
                                    </div>
                                </div>
                            </a>
                        </div>
                        
                        <div class="mt-5 test-credentials">
                      
                            <h6 class="text-uppercase fw-bold" style="font-size: 0.7rem; color: #94a3b8; letter-spacing: 1px;">Acesso de Teste</h6>
                            <div class="d-flex justify-content-between mt-2" style="font-size: 0.8rem;">
                                <span class="text-muted"><strong>Aluno:</strong> joao@email.com</span>
                                <span class="text-muted"><strong>Senha:</strong> 123</span>
                            </div>
                            <div class="d-flex justify-content-between mt-1" style="font-size: 0.8rem;">
                                <span class="text-muted"><strong>Instrutor:</strong> carlos@academia.com</span>
                                <span class="text-muted"><strong>Senha:</strong> 123</span>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
