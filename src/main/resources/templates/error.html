<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>Academia FatOut | Erro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <div class="error-card">
        <i class="bi bi-emoji-frown sad-icon"></i>
        
        <h2 class="error-title">Opa! Algo deu errado.</h2>

        <div class="msg-container">
            <div class="msg-text">
                <span th:text="${errorMessage}">Não conseguimos processar sua solicitação no momento. Por favor, tente novamente mais tarde.</span>
            </div>
        </div>

        <a href="/" class="btn-voltar-home">
            <i class="bi bi-house-door me-2"></i> Voltar ao Início
        </a>
    </div>

</body>
</html>
