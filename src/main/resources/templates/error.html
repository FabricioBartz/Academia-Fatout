<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut | Erro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Mantendo o padrão de fundo com overlay escuro */
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('/images/fundo-academia.avif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .error-card {
            border: none;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            max-width: 450px;
            width: 90%;
            padding: 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* O "Boneco" Triste Moderno */
        .sad-icon {
            font-size: 80px;
            color: #6c757d;
            display: block;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .error-title {
            font-weight: 800;
            color: #212529;
            margin-bottom: 15px;
        }

        .msg-container {
            background: rgba(0, 0, 0, 0.05);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .msg-text {
            color: #495057;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Botão Voltar Estilizado (Padrão FatOut) */
        .btn-voltar-home {
            display: inline-block;
            background-color: #0d6efd;
            color: white !important;
            text-decoration: none !important;
            padding: 12px 30px;
            border-radius: 100px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-voltar-home:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.3);
        }
    </style>
</head>
<body>

    <div class="error-card">
        <i class="bi bi-emoji-frown sad-icon"></i>
        
        <h2 class="error-title">Opa! Algo deu errado.</h2>

        <div class="msg-container">
            <div class="msg-text">
                <span th:text="${errorMessage}">Não conseguimos processar sua solicitação no momento. Por favor, tente novamente mais tarde.</span>
            </div>
        </div>

        <a href="/" class="btn-voltar-home">
            <i class="bi bi-house-door me-2"></i> Voltar ao Início
        </a>
    </div>

</body>
</html>
