<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Erro no Sistema</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { background: #f8f8f8; font-family: Arial, sans-serif; }
        .error-container { max-width: 500px; margin: 80px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #ccc; padding: 32px; text-align: center; }
        h1 { color: #c00; }
        .msg { margin: 24px 0; color: #333; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>Ocorreu um erro!</h1>
        <div class="msg">
            <span th:text="${errorMessage}">Erro inesperado. Tente novamente mais tarde.</span>
        </div>
        <a href="/instrutor/dashboard">Voltar ao Dashboard</a>
    </div>
</body>
</html>
