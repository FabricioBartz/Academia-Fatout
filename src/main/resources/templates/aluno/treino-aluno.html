<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meu Treino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">🏋️ Academia FatOut - Aluno</a>
            <div>

                <a href="/" class="btn btn-light btn-sm">Sair</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="list-group">
                    <a th:href="@{/aluno/dashboard}" class="list-group-item list-group-item-action">Dashboard</a>

            </div>
            
            <div class="col-md-9">
                <h1>Meu Treino</h1>
                <p>Seu plano de treino personalizado.</p>
                <div class="alert alert-info">
                    Treino em desenvolvimento.
