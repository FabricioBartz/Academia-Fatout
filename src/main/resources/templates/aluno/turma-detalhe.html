<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body data-role="aluno">
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#45a049;">
    <div class="container">
        <a class="navbar-brand" href="#">Academia FatOut</a>
        <div class="navbar-text text-white">
            Aluno: <span th:text="${aluno.nome}">Nome</span>
            <a href="/" class="btn btn-outline-dark btn-sm ms-3">Sair</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Menu</h5>
                    <div class="list-group list-group-flush">
                        <a th:href="@{/aluno/painel_principal}" class="list-group-item list-group-item-action">Painel Principal</a>
                        <a th:href="@{/aluno/meu_perfil}" class="list-group-item list-group-item-action">👤 Meu Perfil</a>
                        <a th:href="@{/aluno/meus_treinos}" class="list-group-item list-group-item-action">💪 Meus Treinos</a>
                        <a th:href="@{/aluno/minhas_avaliacoes}" class="list-group-item list-group-item-action">📊 Avaliações</a>
                        <a th:href="@{/aluno/minhas_turmas}" class="list-group-item list-group-item-action active">👥 Minhas Turmas</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-9">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="d-flex align-items-center">
                    <a th:href="${backUrl}" class="btn btn-secondary btn-sm me-3">← Voltar</a>
                    <h1 class="mb-0">Detalhe da Turma</h1>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title mb-1" th:text="${turma.titulo}">Título</h5>
                    <p class="text-muted mb-3" th:text="${turma.descricao}">Descrição</p>
                    <hr>
                    <div class="row">
                        <div class="col-md-6 mb-2">
                            <p><strong>Data:</strong> <span th:text="${#temporals.format(turma.dataDaAula,'dd/MM/yyyy')}">01/01/2025</span></p>
                        </div>
                        <div class="col-md-6 mb-2">
                            <p><strong>Hora:</strong> <span th:text="${#temporals.format(turma.horaAula,'HH:mm')}">10:00</span></p>
                        </div>
                        <div class="col-md-6 mb-2">
                            <p><strong>Vagas:</strong> <span th:text="${turma.vagas}">20</span></p>
                        </div>
                        <div class="col-md-6 mb-2">
                            <p><strong>Vagas Disponíveis:</strong> <span class="badge bg-secondary" th:text="${turma.vagasDisponiveis}">10</span></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Alunos Matriculados</h5>
                    <div th:if="${alunosTurma == null || #lists.isEmpty(alunosTurma)}" class="text-muted">Nenhum aluno matriculado.</div>
                    <ul class="list-group" th:if="${alunosTurma != null && !#lists.isEmpty(alunosTurma)}">
                        <li class="list-group-item" th:each="a : ${alunosTurma}" th:text="${a.nome}">João Silva</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
