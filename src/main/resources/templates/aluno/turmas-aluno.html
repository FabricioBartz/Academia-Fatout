<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Turmas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#45a049;">
        <div class="container">
            <a class="navbar-brand" href="#">🏋️ Academia FatOut</a>
            <div class="navbar-text text-white">
                Aluno: <span th:text="${aluno.nome}">João Silva</span>
                <a href="/" class="btn btn-dark btn-sm ms-3">Sair</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="list-group">
                    <a th:href="@{/aluno/dashboard}" class="list-group-item list-group-item-action">Painel Principal</a>
                    <a th:href="@{/aluno/treino}" class="list-group-item list-group-item-action">Meus Treinos</a>
                    <a th:href="@{/aluno/avaliacoes}" class="list-group-item list-group-item-action">Avaliações</a>
                    <a th:href="@{/aluno/turmas}" class="list-group-item list-group-item-action active">Turmas</a>
                    <a th:href="@{/aluno/perfil}" class="list-group-item list-group-item-action">Meu Perfil</a>
                </div>
            </div>
            
            <div class="col-md-9">
                <h1>Minhas Turmas</h1>
                <p>Turmas em que você está matriculado.</p>
                <div class="alert alert-info">
                    Turmas em desenvolvimento.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
