<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perfil Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#45a049;">
        <div class="container">
            <a class="navbar-brand" href="#">🏋️ Academia FatOut</a>
            <div class="navbar-text text-white">
                Aluno: <span th:text="${aluno.nome}">João Silva</span>
                <a href="/" class="btn btn-dark btn-sm ms-3">Sair</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="list-group">
                    <a th:href="@{/aluno/dashboard}" class="list-group-item list-group-item-action">Painel Principal</a>
                    <a th:href="@{/aluno/treino}" class="list-group-item list-group-item-action">Meu Treino</a>
                    <a th:href="@{/aluno/avaliacoes}" class="list-group-item list-group-item-action">Avaliações</a>
                    <a th:href="@{/aluno/turmas}" class="list-group-item list-group-item-action">Turmas</a>
                    <a th:href="@{/aluno/perfil}" class="list-group-item list-group-item-action active">Meu Perfil</a>
                </div>
            </div>
            
            <div class="col-md-9">
                <h1>Meu Perfil</h1>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${aluno.nome}">Nome</h5>
                        <p class="card-text"><strong>Email:</strong> <span th:text="${aluno.email}">email</span></p>
                        <p class="card-text"><strong>Telefone:</strong> <span th:text="${aluno.telefone}">telefone</span></p>
                        <p class="card-text"><strong>Data de Nascimento:</strong> <span th:text="${aluno.dataNascimento}">data</span></p>
                        <p class="card-text"><strong>Objetivo:</strong> <span th:text="${aluno.objetivo}">objetivo</span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
