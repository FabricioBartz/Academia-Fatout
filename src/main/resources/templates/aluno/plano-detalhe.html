<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meu Plano de Treino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#45a049;">
    <div class="container">
        <a class="navbar-brand" href="#">🏋️ Academia FatOut</a>
        <div class="navbar-text text-white">
            Aluno: <span th:text="${aluno.nome}">João Silva</span>
            <a href="/" class="btn btn-dark btn-sm ms-3">Sair</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
<div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Menu</h5>
                        <div class="list-group list-group-flush">

                            <a th:href="@{/aluno/painel_principal}" class="list-group-item list-group-item-action">Painel Principal</a>
                            <a th:href="@{/aluno/meu_perfil}" class="list-group-item list-group-item-action">👤 Meu Perfil</a>
                            <a th:href="@{/aluno/meus_treinos}" class="list-group-item list-group-item-action active">💪 Meus Treinos</a>
                             <a th:href="@{/aluno/minhas_avaliacoes}" class="list-group-item list-group-item-action">📊 Avaliações</a>
                            <a th:href="@{/aluno/minhas_turmas}" class="list-group-item list-group-item-action">👥 Minhas Turmas</a>
                             
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        <div class="col-md-9">
            <div class="d-flex align-items-center mb-4">
                <a th:href="@{/aluno/treino}" class="btn btn-secondary btn-sm me-3">← Voltar</a>
                <h1 class="mb-0">Plano de Treino</h1>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div>
                        <strong th:text="${plano.nome}">Treino A</strong>
                        <span class="text-muted ms-2" th:text="${#temporals.format(plano.dataCriacao, 'dd/MM/yyyy')}">10/12/2025</span>
                    </div>
                    <span class="badge bg-secondary" th:text="${plano.diasSemana}">SEG,QUA,SEX</span>
                </div>
                <div class="card-body">
                    <div class="list-group">
                        <div th:each="ep : ${plano.exercicios}" class="list-group-item">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <strong th:text="${ep.exercicio.nome}">Exercício</strong>
                                    <span class="text-muted ms-2" th:text="'Séries: ' + ${ep.series} + ' | Reps: ' + ${ep.repeticoes}">Séries/Reps</span>
                                </div>
                                <span class="text-muted" th:text="${ep.carga != null} ? ('Carga: ' + ep.carga + ' kg') : ''"></span>
                            </div>
                            <div th:if="${ep.observacoes}" class="mt-2">
                                <small class="text-muted" th:text="${ep.observacoes}"></small>
                            </div>
                        </div>
                    </div>
                    <div th:if="${plano.observacoes}" class="mt-3">
                        <small class="text-muted" th:text="${plano.observacoes}"></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
