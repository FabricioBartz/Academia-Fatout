<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">🏋️ Academia FatOut - Aluno</a>
            <div>
                <span class="text-white me-3" th:text="${aluno.nome}">João Silva</span>
                <a href="/" class="btn btn-light btn-sm">Sair</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="list-group">
                    <a th:href="@{/aluno/dashboard}" class="list-group-item list-group-item-action active">Dashboard</a>
                    <a th:href="@{/aluno/treino}" class="list-group-item list-group-item-action">Meu Treino</a>
                    <a th:href="@{/aluno/avaliacoes}" class="list-group-item list-group-item-action">Avaliações</a>
                    <a th:href="@{/aluno/turmas}" class="list-group-item list-group-item-action">Turmas</a>
                    <a th:href="@{/aluno/perfil}" class="list-group-item list-group-item-action">Meu Perfil</a>
                </div>
            </div>
            
            <div class="col-md-9">
                <h1>Olá, <span th:text="${aluno.nome}">João</span>!</h1>
                <p class="lead" th:text="${aluno.objetivo}">Seu objetivo: Hipertrofia</p>
                
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">📊 Última Avaliação</h5>
                                <p class="card-text">Peso: 82.5 kg</p>
                                <p class="card-text">Altura: 1.78 m</p>
                                <p class="card-text">IMC: 26.0</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">💪 Treino de Hoje</h5>
                                <p class="card-text">Treino A - Peito e Tríceps</p>
                                <p class="card-text">4 exercícios</p>
                                <a th:href="@{/aluno/treino}" class="btn btn-primary">Ver Treino</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
