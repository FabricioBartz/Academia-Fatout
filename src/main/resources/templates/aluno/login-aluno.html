<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Academia FatOut</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 400px;
            margin: 0 auto;
        }
        .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="logo">🏋️ Academia FatOut</div>
            <h3 class="text-center mb-4">Login Aluno</h3>
            
            <form th:action="@{/aluno/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" 
                           placeholder="seu@email.com" required>
                </div>
                
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" 
                           placeholder="Digite sua senha" required>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success btn-lg">Entrar</button>
                    <a th:href="@{/}" class="btn btn-outline-secondary">Voltar</a>
                </div>
                
                <div class="mt-4 text-center">
                    <small class="text-muted">Credenciais para teste:</small><br>
                    <small><strong>Email:</strong> joao@email.com</small><br>
                    <small><strong>Senha:</strong> 123</small>
                </div>
                
                <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}">
                    Erro no login
                </div>
            </form>
        </div>
    </div>
</body>
</html>
