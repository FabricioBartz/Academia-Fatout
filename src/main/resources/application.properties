# Configuração do Spring Boot
spring.application.name=academia-fatout

# Configuração do Banco de Dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/academia_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=your_password

# Configuração do JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração do Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML5
spring.thymeleaf.encoding=UTF-8

# Configuração do servidor
server.port=8080
server.servlet.context-path=/

# ESSA LINHA RESOLVE: Executa data.sql DEPOIS que o Hibernate cria as tabelas
spring.jpa.defer-datasource-initialization=true