# Porta alternativa para evitar conflito durante desenvolvimento
# Permite sobrescrever via variável de ambiente PORT; padrão 8083
server.port=8080
# Configuração do Spring Boot
spring.application.name=academia-fatout

# Configuração do Banco de Dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/academia_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=admin

# Configuração do JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração do Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML5
spring.thymeleaf.encoding=UTF-8

# Configuração do servidor
server.servlet.context-path=/

# ESSA LINHA RESOLVE: Executa data.sql DEPOIS que o Hibernate cria as tabelas
spring.jpa.defer-datasource-initialization=true

# Limites de upload de arquivos (fotos de perfil)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Diretório base para uploads (dentro do projeto)
app.upload.base-dir=${user.dir}/uploads

app.reset.enabled=true
app.reset.interval-ms=21600000