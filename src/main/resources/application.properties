# Configuração do Spring Boot
spring.application.name=academia-fatout

# Configuração do Banco de Dados H2 (em memória)
spring.datasource.url=jdbc:h2:mem:academiadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração do H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuração do JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração do Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML5
spring.thymeleaf.encoding=UTF-8

# Configuração do servidor
server.port=8080
server.servlet.context-path=/

# ESSA LINHA RESOLVE: Executa data.sql DEPOIS que o Hibernate cria as tabelas
spring.jpa.defer-datasource-initialization=true